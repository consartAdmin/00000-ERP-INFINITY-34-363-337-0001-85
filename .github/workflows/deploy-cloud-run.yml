# Deploy do backend no Cloud Run pelo GitHub (botão "Run workflow" na aba Actions).
# Roda o mesmo backend/deploy.ps1 usado no PC, num runner Linux com PowerShell.
#
# Configuração única (Settings > Secrets and variables > Actions):
#   Variable GCP_WIF_PROVIDER  provider do Workload Identity (login sem chave)
#   Variable GCP_SA_EMAIL      service account do deploy (opcional; padrão abaixo)
#   Secret   GCP_SA_KEY        alternativa ao Workload Identity: JSON da chave
#   Secret   ENV_FILE          conteúdo completo do backend/.env
#   Secret   ENV_FILE_LOGISTICS / ENV_FILE_PRODNEX / ENV_FILE_CONSART  .env de backend-logistics/, backend-prodnex/ e backend-consart/
#
# Os 4 projetos rodam no mesmo serviço (erp-infinity-00000): a imagem leva
# backend/ e uma cópia de backend-logistics/, backend-prodnex/ e backend-consart/
# em apps/, e o start.js sobe cada um com o próprio banco. No modo completo as
# variáveis de cada projeto vêm do secret dele (gravadas com prefixo, ex.: CONSART__DB_NAME).
# Outro cliente: crie outro secret (ex.: ENV_FILE_00001) e informe o nome ao rodar
# (nesse caso só o Infinity vai na imagem).

name: Deploy Cloud Run

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "so-codigo = mantém envs e segredos do serviço (-ImageOnly); completo = aplica os .env dos secrets (Infinity + projetos)"
        type: choice
        options:
          - so-codigo
          - completo
        default: so-codigo
      env_secret:
        description: "Nome do secret com o .env (vazio = ENV_FILE). Outro cliente: informe o secret dele"
        type: string
        default: ""
      projetos:
        description: "Projetos no mesmo serviço (vazio = logistics,prodnex,consart com o ENV_FILE; nenhum com outro secret)"
        type: string
        default: ""
      service:
        description: "Serviço Cloud Run (vazio = DEPLOY_SERVICE do .env)"
        type: string
        default: ""
      project:
        description: "Projeto GCP (vazio = DEPLOY_PROJECT do .env)"
        type: string
        default: ""
      region:
        description: "Região (vazio = DEPLOY_REGION do .env)"
        type: string
        default: ""

# Um deploy por vez para o mesmo serviço
concurrency:
  group: deploy-${{ inputs.service || inputs.env_secret || 'ENV_FILE' }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write  # login sem chave (Workload Identity)

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ENV_SECRET: ${{ inputs.env_secret || 'ENV_FILE' }}
      PROJETOS: ${{ inputs.projetos || ((inputs.env_secret == '' || inputs.env_secret == 'ENV_FILE') && 'logistics,prodnex,consart') || 'nenhum' }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Autenticar no Google Cloud (sem chave)
        if: ${{ vars.GCP_WIF_PROVIDER != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL || 'github-deploy@erp-infinity-0-to-9.iam.gserviceaccount.com' }}

      - name: Autenticar no Google Cloud (chave JSON)
        if: ${{ vars.GCP_WIF_PROVIDER == '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Montar .env a partir do secret
        env:
          ENV_CONTENT: ${{ secrets[env.ENV_SECRET] }}
          MODO: ${{ inputs.modo }}
        run: |
          if [ -z "$ENV_CONTENT" ]; then
            if [ "$MODO" = "completo" ]; then
              echo "::error::Secret '${{ env.ENV_SECRET }}' vazio ou inexistente. O modo completo precisa do .env."
              exit 1
            fi
            echo "Sem .env: usando apenas service/project/region informados."
            exit 0
          fi
          # DEPLOY_ACCOUNT é a conta do PC; aqui a conta é a service account do GCP_SA_KEY
          printf '%s\n' "$ENV_CONTENT" | tr -d '\r' | grep -v '^[[:space:]]*DEPLOY_ACCOUNT[[:space:]]*=' > .env
          echo ".env montado ($(grep -c '' .env) linhas)."

      - name: Montar .env dos projetos (modo completo)
        if: ${{ inputs.modo == 'completo' }}
        env:
          ENV_LOGISTICS: ${{ secrets.ENV_FILE_LOGISTICS }}
          ENV_PRODNEX: ${{ secrets.ENV_FILE_PRODNEX }}
          ENV_CONSART: ${{ secrets.ENV_FILE_CONSART }}
        run: |
          for nome in $(printf '%s' "$PROJETOS" | tr ',' ' '); do
            case "$nome" in
              logistics) conteudo="$ENV_LOGISTICS"; secret=ENV_FILE_LOGISTICS ;;
              prodnex)   conteudo="$ENV_PRODNEX";   secret=ENV_FILE_PRODNEX ;;
              consart)   conteudo="$ENV_CONSART";   secret=ENV_FILE_CONSART ;;
              nenhum)    continue ;;
              *) echo "::error::Projeto desconhecido: $nome"; exit 1 ;;
            esac
            if [ -z "$conteudo" ]; then
              echo "::error::Secret $secret vazio ou inexistente (projeto $nome)."
              exit 1
            fi
            printf '%s\n' "$conteudo" | tr -d '\r' > "../backend-$nome/.env"
            echo "backend-$nome/.env montado a partir do $secret."
          done

      - name: Deploy
        shell: pwsh
        env:
          TEMP: ${{ runner.temp }}
          MODO: ${{ inputs.modo }}
          IN_SERVICE: ${{ inputs.service }}
          IN_PROJECT: ${{ inputs.project }}
          IN_REGION: ${{ inputs.region }}
        run: |
          $params = @{}
          if ($env:MODO -eq "so-codigo") { $params.ImageOnly = $true }
          if ($env:IN_SERVICE) { $params.Service = $env:IN_SERVICE }
          if ($env:IN_PROJECT) { $params.Project = $env:IN_PROJECT }
          if ($env:IN_REGION)  { $params.Region  = $env:IN_REGION }
          $params.Projetos = $env:PROJETOS
          ./deploy.ps1 @params

      - name: Apagar .env do runner
        if: always()
        run: rm -f .env ../backend-logistics/.env ../backend-prodnex/.env ../backend-consart/.env

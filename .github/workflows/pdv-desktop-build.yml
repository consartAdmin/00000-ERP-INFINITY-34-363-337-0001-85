name: Gerar instalador PDV (Consart Starter)

# Gera o instalador Windows (.exe) da frente de caixa em pdv-desktop/.
# Rode em Actions → "Gerar instalador PDV" → Run workflow e baixe o
# arquivo em "Artifacts" no fim da execução.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pdv-desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Gerar instalador
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - uses: actions/upload-artifact@v4
        with:
          name: consart-starter-instalador
          path: pdv-desktop/dist/*.exe
          if-no-files-found: error

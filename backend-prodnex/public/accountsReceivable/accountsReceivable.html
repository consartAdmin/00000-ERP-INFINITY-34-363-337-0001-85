<!-- backend/public/accountsReceivable/accountsReceivable.html -->
<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- 🟦 Favicons CONSART -->
  <link rel="icon" type="image/png" sizes="16x16" href="/public/imagens/brasaoConsartInfinity.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/public/imagens/brasaoConsartInfinity.png">
  <link rel="icon" type="image/png" sizes="64x64" href="/public/imagens/brasaoConsartInfinity.png">
  <link rel="icon" href="/public/imagens/brasaoConsartInfinity.png">

  <title>CONTAS À RECEBER | PRODNEX ERP</title>

  <!-- CSS global do tema -->
  <link rel="stylesheet" href="/public/includes/css/style.css" />

  <!-- CSS do modal de busca do plano de contas -->
  <link rel="stylesheet" href="/public/modalsSearch/chartAccountsModalSearch.css" />

  <!-- CSS específico do módulo -->
  <style>
    /* Mantém as linhas do cadastro visualmente separadas sem afetar os outros modais. */
    #arForm,
    #receiveForm {
      display: flex;
      flex-direction: column;
      row-gap: 16px;
      padding-bottom: 8px;
    }

    #arForm>.fields-inline,
    #receiveForm>.fields-inline {
      flex: 0 0 auto;
      align-items: flex-start;
    }

    /* Ações da tabela: só ícones, numa linha */
    .ar-actions {
      flex-wrap: nowrap;
      gap: 6px;
      justify-content: center;
    }

    .ar-actions .btn {
      min-width: 34px;
      padding-inline: 8px;
      font-size: 15px;
      line-height: 1;
    }

    /* Modal de resultado da sincronização com o Asaas */
    .center-modal.ar-sync-modal {
      width: min(900px, calc(100% - 32px));
    }

    .ar-sync-summary {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      align-items: center;
      margin-bottom: 10px;
      font-size: 13px;
    }

    .ar-sync-pill {
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 12px;
    }

    .ar-sync-pill--changed { background: #dcfce7; color: #166534; }
    .ar-sync-pill--failed { background: #fee2e2; color: #991b1b; }

    .ar-sync-table-wrap {
      max-height: 55vh;
      overflow: auto;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
    }

    .ar-sync-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      text-align: left;
    }

    .ar-sync-table th {
      position: sticky;
      top: 0;
      background: #f8fafc;
      font-weight: 600;
      white-space: nowrap;
    }

    .ar-sync-table th,
    .ar-sync-table td {
      padding: 6px 10px;
      border-bottom: 1px solid #f1f5f9;
    }

    .ar-sync-table .ar-sync-right { text-align: right; white-space: nowrap; }
    .ar-sync-table .ar-sync-customer { max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ar-sync-table tr.is-changed td { background: #f0fdf4; }
    .ar-sync-table tr.is-failed td { background: #fef2f2; }
    .ar-sync-error { color: #b91c1c; font-weight: 600; cursor: help; }

    /* Progresso da sincronização */
    .ar-sync-progress { display: flex; flex-direction: column; gap: 10px; font-size: 13px; text-align: left; }
    .ar-sync-progress__head { display: flex; justify-content: space-between; gap: 12px; }
    .ar-sync-progress__bar { height: 8px; border-radius: 999px; background: #e5e7eb; overflow: hidden; }
    .ar-sync-progress__bar span { display: block; height: 100%; width: 0; background: #16a34a; transition: width .25s ease; }
    .ar-sync-progress__log {
      list-style: none; margin: 0; padding: 0;
      max-height: 40vh; overflow: auto;
      border: 1px solid #e5e7eb; border-radius: 8px;
    }
    .ar-sync-progress__log:empty { display: none; }
    .ar-sync-progress__log li {
      display: grid; grid-template-columns: 18px 1fr auto; gap: 8px; align-items: center;
      padding: 5px 10px; border-bottom: 1px solid #f1f5f9; font-size: 12px;
    }
    .ar-sync-progress__log li.is-changed { background: #f0fdf4; }
    .ar-sync-progress__log li.is-failed { background: #fef2f2; }
    .ar-sync-progress__icon { color: #16a34a; font-weight: 700; }
    .ar-sync-progress__log li.is-failed .ar-sync-progress__icon { color: #b91c1c; }
    .ar-sync-progress__name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ar-sync-progress__hint { color: #6b7280; }
  </style>
</head>

<body class="consart-theme p-page pw-page--full ph-page--xr">
  <main class="consart-container consart-container--full consart-container--ultraslim">

    <section class="table-layout-integrated table-max-height-700">
      <div class="table-layout-integrated-filter">

        <div class="header header-h-5">
          <form class="fields-inline fields-gap-3" id="filterForm">

            <div class="fields fields-h-6 fields-w-20 fields-gap-3">
              <label for="filterSearch">Buscar</label>
              <input type="text" id="filterSearch" name="search"
                placeholder="Cliente, número da fatura, descrição..." />
            </div>

            <div class="fields fields-h-6 fields-w-5">
              <label for="filterStatus">Status</label>
              <select id="filterStatus" name="status">
                <option value="">Todos</option>
                <option value="PENDING">Pendente</option>
                <option value="PAID">Recebido</option>
                <option value="OVERDUE">Vencido</option>
                <option value="CANCELLED">Cancelado</option>
              </select>
            </div>

            <div class="fields fields-h-6 fields-w-10">
              <label for="filterBankAccount">Conta Bancária</label>
              <select id="filterBankAccount" name="bankAccountId">
                <option value="">Todas</option>
                <option value="NONE">Sem banco</option>
                <!-- Contas bancárias via JS -->
              </select>
            </div>

            <div class="fields fields-h-6 fields-w-7">
              <label for="filterDateType">Filtrar por</label>
              <select id="filterDateType" name="dateType">
                <option value="issue_date">Emissão</option>
                <option value="due_date" selected>Vencimento</option>
              </select>
            </div>

            <div class="fields-inline">
              <div class="fields fields-h-6 fields-w-20 fields-gap-3">
                <!-- Date range: emissão ou vencimento -->

                <div class="fields fields-h-6 fields-w-16 fields-font-3">
                  <date-range-field id="filterDateRange" class="drf-width-3 drf-height-3" label="Período"
                    locale="pt-BR"></date-range-field>
                </div>

                <input type="hidden" id="filterFromDue">
                <input type="hidden" id="filterToDue">
              </div>

              <div class="btn-inline btn-gap-3">
                <button type="submit" id="btnApplyFilters" class="btn btn-new btn-sm">
                  Aplicar Filtros
                </button>

                <button type="button" id="btnClearFilters" class="btn btn-new btn-sm">
                  Limpar
                </button>
              </div>

              <button type="button" id="btnSyncAsaas" class="btn btn-new btn-sm">
                🔄 Sincronizar
              </button>
            </div>

            <div class="btn-inline btn-position-right">
              <button type="button" id="btnNew" class="btn btn-new btn-sm">
                Nova Conta a Receber
              </button>

              <button type="button" id="btnExportPdf" class="btn btn-toolbar btn-sm" title="Exportar PDF">
                <img src="/iconsImagens/pdf.png" alt="" width="20" height="20" aria-hidden="true" />

                <span>Exportar PDF</span>
              </button>

              <button id="btnExportExcel" class="btn btn-toolbar btn-sm" type="button" title="Exportar Excel">
                <img src="/iconsImagens/excelIcons.png" alt="" width="20" height="20" aria-hidden="true" />
                <span>Exportar Excel</span>
              </button>
            </div>

          </form>
        </div>
      </div>

      <div class="table-scroll table-height-flex table-row-h-20" data-table-settings="accountsreceivable.table-1">
        <table class="table table-fixed table-zebra table-zebra-hover table-sticky-head">
          <!--
            Larguras fixas: a tabela não pode mudar de layout conforme o
            conteúdo filtrado. A ordem dos <col> segue a ordem das colunas.
          -->
          <colgroup>
            <col class="table-col-w-2">  <!-- ID:           70px  -->
            <col class="table-col-w-4">  <!-- Cliente (ID): 110px -->
            <col class="table-col-w-8">  <!-- Cliente:      220px -->
            <col class="table-col-w-6">  <!-- Banco:        150px -->
            <col class="table-col-w-4">  <!-- Tipo Doc.:    110px -->
            <col class="table-col-w-6">  <!-- Nº Fatura:    150px -->
            <col class="table-col-w-4">  <!-- Emissão:      110px -->
            <col class="table-col-w-5">  <!-- Vencimento:   130px -->
            <col class="table-col-w-4">  <!-- Status:       110px -->
            <col class="table-col-w-4">  <!-- Total:        110px -->
            <col class="table-col-w-4">  <!-- Recebido:     110px -->
            <col class="table-col-w-4">  <!-- Saldo:        110px -->
            <col class="table-col-w-7">  <!-- Ações:        180px -->
          </colgroup>

          <thead>
            <tr>
              <th class="col-id table-sortable" data-sort-column="id" aria-sort="ascending">
                <button type="button" class="table-sort-button" data-sort-button title="Ordenar por ID">
                  ID
                  <span data-sort-icon aria-hidden="true">▲</span>
                </button>
              </th>

              <th class="table-sortable" data-sort-column="customer_id" aria-sort="none">
                <button type="button" class="table-sort-button" data-sort-button title="Ordenar pelo ID do cliente">
                  Cliente (ID)
                  <span data-sort-icon aria-hidden="true">⇅</span>
                </button>
              </th>

              <th class="table-sortable" data-sort-column="customer_name" aria-sort="none">
                <button type="button" class="table-sort-button" data-sort-button title="Ordenar pelo cliente">
                  Cliente
                  <span data-sort-icon aria-hidden="true">⇅</span>
                </button>
              </th>

              <th class="ar-col-bank table-sortable" data-sort-column="account_bank" aria-sort="none">
                <button type="button" class="table-sort-button" data-sort-button title="Ordenar pelo banco da fatura">
                  Banco
                  <span data-sort-icon aria-hidden="true">⇅</span>
                </button>
              </th>

              <th class="ar-col-doctype table-sortable" data-sort-column="document_type_name" aria-sort="none">
                <button type="button" class="table-sort-button" data-sort-button title="Ordenar pelo tipo de documento">
                  Tipo Doc.
                  <span data-sort-icon aria-hidden="true">⇅</span>
                </button>
              </th>

              <th class="table-sortable" data-sort-column="invoice_number" aria-sort="none">
                <button type="button" class="table-sort-button" data-sort-button title="Ordenar pelo número da fatura">
                  Nº Fatura
                  <span data-sort-icon aria-hidden="true">⇅</span>
                </button>
              </th>

              <th class="table-sortable" data-sort-column="issue_date" aria-sort="none">
                <button type="button" class="table-sort-button" data-sort-button title="Ordenar pela emissão">
                  Emissão
                  <span data-sort-icon aria-hidden="true">⇅</span>
                </button>
              </th>

              <th class="table-sortable" data-sort-column="due_date" aria-sort="none">
                <button type="button" class="table-sort-button" data-sort-button title="Ordenar pelo vencimento">
                  Vencimento
                  <span data-sort-icon aria-hidden="true">⇅</span>
                </button>
              </th>

              <th class="table-sortable" data-sort-column="status" aria-sort="none">
                <button type="button" class="table-sort-button" data-sort-button title="Ordenar pelo status">
                  Status
                  <span data-sort-icon aria-hidden="true">⇅</span>
                </button>
              </th>

              <th class="col-valor table-sortable" data-sort-column="total" aria-sort="none">
                <button type="button" class="table-sort-button" data-sort-button title="Ordenar pelo total">
                  Total
                  <span data-sort-icon aria-hidden="true">⇅</span>
                </button>
              </th>

              <th class="col-valor table-sortable" data-sort-column="received" aria-sort="none">
                <button type="button" class="table-sort-button" data-sort-button title="Ordenar pelo valor recebido">
                  Recebido
                  <span data-sort-icon aria-hidden="true">⇅</span>
                </button>
              </th>

              <th class="col-valor table-sortable" data-sort-column="balance" aria-sort="none">
                <button type="button" class="table-sort-button" data-sort-button title="Ordenar pelo saldo">
                  Saldo
                  <span data-sort-icon aria-hidden="true">⇅</span>
                </button>
              </th>

              <th class="ar-col-actions col-actions">
                Ações
              </th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <!-- Linhas via JS -->
          </tbody>
        </table>
      </div>

      <footer class="table-footer">

        <div class="table-footer__info">
          <div class="summary-pill summary-pill--success summary-width-4 summary-left-space-3">
            <span id="apTableInfo">0 Registros </span>
          </div>

          <div class="ap-topbar__right summary summary--center summary-gap-8">
            <div class="summary-pill">
              Total (filtro) <span id="arSummaryTotal">R$ 0,00</span>
            </div>

            <div class="summary-pill summary-pill--success">
              Pago <span id="arSummaryPaid">R$ 0,00</span>
            </div>

            <div class="summary-pill summary-pill--warning">
              Aberto <span id="arSummaryBalance">R$ 0,00</span>
            </div>
          </div>
        </div>

        <div class="table-footer__pagination">
          <button type="button" id="btnPreviousPage" class="btn btn-clean btn-sm">
            Anterior
          </button>

          <span id="apPageInfo">Página 1 de 1</span>

          <button type="button" id="btnNextPage" class="btn btn-new btn-sm">
            Próxima
          </button>
        </div>

        <div class="table-footer__page-size">
          <label for="apRowsPerPage">Mostrar</label>

          <select id="apRowsPerPage" class="table-footer__page-size-select" name="rowsPerPage">
            <option value="10">10 linhas</option>
            <option value="20">20 linhas</option>
            <option value="30">30 linhas</option>
            <option value="50" selected>50 linhas</option>
            <option value="100">100 linhas</option>
          </select>
        </div>

      </footer>
    </section>
  </main>

  <div id="arFormOverlay" class="modal modal-width-7 modal-height-7" aria-hidden="true">
    <div class="modal__backdrop"></div>

    <div class="modal__dialog">
      <section class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="arFormTitle">
        <header class="modal__header modal-header-color-3">
          <h3 id="arFormTitle">Nova Conta a Receber</h3>

          <button type="button" id="btnCloseForm" data-modal-close class="btn btn-new btn-sm btn-icon"
            aria-label="Fechar">
            ✕
          </button>
        </header>

        <div class="modal__body">
          <form id="arForm">
            <input type="hidden" id="arId">

            <!-- Cliente, fatura and document -->
            <div class="fields-inline fields-gap-2">
              <div class="fields fields-w-25 fields-h-5 fields-p-left-10">
                <label for="arCustomerSearch">Cliente</label>

                <input type="hidden" id="arCustomerId" name="customer_id">

                <input type="text" id="arCustomerSearch" placeholder="Clique para localizar um cliente"
                  autocomplete="off" readonly required role="button" aria-haspopup="dialog">
              </div>

              <div class="fields fields-w-14 fields-h-5">
                <label for="arInvoiceNumber">Nº da Fatura</label>
                <input type="text" id="arInvoiceNumber" placeholder="Número da fatura">
              </div>

              <div class="fields fields-w-16 fields-h-5">
                <label for="arDocumentNumber">Nº Documento</label>
                <input type="text" id="arDocumentNumber" placeholder="Número do documento">
              </div>
            </div>

            <!-- Dates and status -->
            <div class="fields-inline fields-gap-2">
              <div class="fields fields-w-10 fields-h-5 fields-p-left-10">
                <label for="arIssueDate">Emissão</label>
                <input type="date" id="arIssueDate" required>
              </div>

              <div class="fields fields-w-10 fields-h-5 fields-p-left-10">
                <label for="arDueDate">Vencimento</label>
                <input type="date" id="arDueDate" required>
              </div>

              <div class="fields fields-w-10 fields-h-5 fields-p-left-10">
                <label for="arPaymentDate">Pagamento</label>
                <input type="date" id="arPaymentDate">
              </div>

              <div class="fields fields-w-15 fields-h-5 fields-p-left-10">
                <label for="arStatus">Status</label>

                <select id="arStatus" required>
                  <option value="PENDING">Pendente</option>
                  <option value="PAID">Recebido</option>
                  <option value="OVERDUE">Vencido</option>
                  <option value="CANCELLED">Cancelado</option>
                </select>
              </div>

              <div class="fields fields-w-15 fields-h-5 fields-p-left-10">
                <label for="arPaymentMethodId">
                  Forma de Pagamento
                </label>

                <select id="arPaymentMethodId">
                  <option value="">Selecione...</option>
                </select>
              </div>
            </div>


            <div class="fields-inline fields-gap-2">
              <div class="fields fields-w-11 fields-h-5  fields-p-left-10">
                <label for="arDocumentTypeId">Tipo de Documento</label>

                <select id="arDocumentTypeId">
                  <option value="">Selecione...</option>
                </select>
              </div>

              <div class="fields fields-w-15 fields-h-5">
                <label for="arCategoryId">Categoria</label>

                <select id="arCategoryId">
                  <option value="">Selecione...</option>
                </select>
              </div>

              <div class="fields fields-w-15 fields-h-5">
                <label for="arSubcategoryId">Subcategoria</label>

                <select id="arSubcategoryId">
                  <option value="">Selecione...</option>
                </select>
              </div>

              <div class="fields fields-w-18 fields-h-5">
                <label for="arChartAccountId">Plano de Contas</label>
                <input type="hidden" id="arChartAccountId">
                <input type="text" id="arChartAccountSearch" placeholder="Clique para localizar uma conta contábil"
                  readonly role="button" aria-haspopup="dialog">
              </div>
            </div>

            <div class="fields-inline fields-gap-2">
              <div class="fields fields-w-10 fields-h-5 fields-p-left-10">
                <label for="arCashAccountId">Conta Caixa</label>
                <select id="arCashAccountId" name="bank_account_id">
                  <option value="">Selecione...</option>
                  <!-- Contas bancárias (public."bankAccounts") via JS -->
                </select>
              </div>

              <!-- Values and payment method -->
              <div class="fields fields-w-8 fields-h-5">
                <label for="arTotalValue">Valor Total</label>
                <input type="number" id="arTotalValue" min="0" step="0.01" required>
              </div>

              <div class="fields fields-w-8 fields-h-5">
                <label for="arAmountPaid">Valor Recebido</label>
                <input type="number" id="arAmountPaid" min="0" step="0.01" value="0">
              </div>

              <div class="fields fields-w-8 fields-h-5">
                <label for="arFine">Multa (R$)</label>
                <input type="number" id="arFine" min="0" step="0.01" value="0.00">
              </div>

              <div class="fields fields-w-8 fields-h-5">
                <label for="arInterest">Juros (R$)</label>
                <input type="number" id="arInterest" min="0" step="0.01" value="0.00">
              </div>

              <div class="fields fields-w-8 fields-h-5">
                <label for="arCharges">Encargos (R$)</label>
                <input type="number" id="arCharges" min="0" step="0.01" value="0.00">
              </div>
            </div>

            <div class="fields-inline fields-gap-2">
              <div class="fields fields-w-full fields-h-5 fields-p-left-10">
                <label for="arDescription">Descrição</label>

                <input type="text" id="arDescription" placeholder="Descrição da conta">
              </div>
            </div>

            <!-- Notes and attachment -->
            <div class="fields-inline fields-gap-2">
              <div class="fields fields-w-full fields-h-5 fields-p-left-10">
                <label for="arNotes">Observações</label>
                <textarea id="arNotes" rows="3"></textarea>
              </div>
            </div>

            <div class="fields-inline fields-gap-2">
              <div class="fields fields-w-full fields-h-5 fields-p-left-10">
                <label for="arAttachmentUrl">URL do Anexo</label>
                <input type="url" id="arAttachmentUrl">
              </div>
            </div>
          </form>
        </div>

        <!-- Direct child of modal__panel -->
        <footer class="modal__footer modal-footer-color-3">
          <button type="button" id="btnCancelForm" data-modal-close class="btn btn-new btn-sm">
            Cancelar
          </button>

          <button type="submit" form="arForm" class="btn btn-new btn-sm">
            Salvar Conta
          </button>
        </footer>
      </section>
    </div>
  </div>

  <!-- Modal Receber Conta a Receber -->
  <div id="receiveModal" class="modal modal-width-7 modal-height-7" aria-hidden="true">
    <div class="modal__backdrop"></div>

    <div class="modal__dialog">
      <section class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="receiveModalTitle">

        <header class="modal__header modal-header-color-3">
          <h3 id="receiveModalTitle">💵 Receber Conta a Receber</h3>

          <button type="button" id="btnCloseReceive" data-modal-close class="btn btn-new btn-sm btn-icon"
            aria-label="Fechar">
            ✕
          </button>
        </header>

        <div class="modal__body">
          <form id="receiveForm">
            <input type="hidden" id="receive_account_id">

            <!-- ====================================================== -->
            <!-- DADOS ORIGINAIS DA CONTA                               -->
            <!-- ====================================================== -->

            <!-- Cliente, fatura e documento -->
            <div class="fields-inline fields-gap-2">
              <div class="fields fields-w-25 fields-h-5 fields-p-left-10">
                <label for="receive_cliente">Cliente</label>
                <input type="text" id="receive_cliente" readonly>
              </div>

              <div class="fields fields-w-14 fields-h-5">
                <label for="receive_fatura">Nº da Fatura</label>
                <input type="text" id="receive_fatura" readonly>
              </div>

              <div class="fields fields-w-16 fields-h-5">
                <label for="receive_documento">Nº Documento</label>
                <input type="text" id="receive_documento" readonly>
              </div>
            </div>

            <!-- Datas, status e forma de pagamento -->
            <div class="fields-inline fields-gap-2">
              <div class="fields fields-w-10 fields-h-5 fields-p-left-10">
                <label for="receive_emissao">Emissão</label>
                <input type="date" id="receive_emissao" readonly>
              </div>

              <div class="fields fields-w-10 fields-h-5 fields-p-left-10">
                <label for="receive_vencimento">Vencimento</label>
                <input type="date" id="receive_vencimento" readonly>
              </div>

              <div class="fields fields-w-10 fields-h-5 fields-p-left-10">
                <label for="receive_data_hora">Data Recebimento</label>
                <input type="datetime-local" id="receive_data_hora" required>
              </div>

              <div class="fields fields-w-10 fields-h-5 fields-p-left-10">
                <label for="receive_status">Status</label>
                <input type="text" id="receive_status" readonly>
              </div>

              <div class="fields fields-w-15 fields-h-5 fields-p-left-10">
                <label for="receive_payment_method_id">Forma de Pagamento</label>
                <select id="receive_payment_method_id" disabled>
                  <option value="">Selecione...</option>
                </select>
              </div>
            </div>

            <!-- Classificação financeira -->
            <div class="fields-inline fields-gap-2">
              <div class="fields fields-w-11 fields-h-5 fields-p-left-10">
                <label for="receive_document_type_id">Tipo de Documento</label>
                <select id="receive_document_type_id">
                  <option value="">Selecione...</option>
                </select>
              </div>

              <div class="fields fields-w-15 fields-h-5">
                <label for="receive_categoria">Categoria</label>
                <select id="receive_categoria">
                  <option value="">Selecione...</option>
                </select>
              </div>

              <div class="fields fields-w-15 fields-h-5">
                <label for="receive_subcategoria">Subcategoria</label>
                <select id="receive_subcategoria">
                  <option value="">Selecione...</option>
                </select>
              </div>

              <div class="fields fields-w-18 fields-h-5">
                <label for="receive_chart_account_search">Plano de Contas</label>
                <input type="hidden" id="receive_chart_account_id">
                <input type="text" id="receive_chart_account_search"
                  placeholder="Clique para localizar uma conta contábil" readonly role="button" aria-haspopup="dialog">
              </div>
            </div>

            <!-- ====================================================== -->
            <!-- DADOS DO RECEBIMENTO                                   -->
            <!-- ====================================================== -->

            <!-- Conta caixa e valores -->
            <div class="fields-inline fields-gap-2">
              <div class="fields fields-w-10 fields-h-5 fields-p-left-10">
                <label for="receive_conta_caixa">Conta Caixa</label>
                <select id="receive_conta_caixa" name="bank_account_id" required>
                  <option value="">Selecione...</option>
                  <!-- Contas bancárias (public."bankAccounts") via JS -->
                </select>
              </div>

              <div class="fields fields-w-8 fields-h-5">
                <label for="receive_valor_original">Valor Original</label>
                <input type="number" id="receive_valor_original" step="0.01" min="0" readonly>
              </div>

              <div class="fields fields-w-8 fields-h-5">
                <label for="receive_valor_recebido">Valor Recebido</label>
                <input type="number" id="receive_valor_recebido" step="0.01" min="0" required>
              </div>

              <div class="fields fields-w-8 fields-h-5">
                <label for="receive_desconto">Desconto (R$)</label>
                <input type="number" id="receive_desconto" step="0.01" min="0" value="0.00">
              </div>

              <div class="fields fields-w-8 fields-h-5">
                <label for="receive_multa">Multa (R$)</label>
                <input type="number" id="receive_multa" step="0.01" min="0" value="0.00">
              </div>

              <div class="fields fields-w-8 fields-h-5">
                <label for="receive_juros">Juros (R$)</label>
                <input type="number" id="receive_juros" step="0.01" min="0" value="0.00">
              </div>

              <div class="fields fields-w-8 fields-h-5">
                <label for="receive_encargos">Encargos (R$)</label>
                <input type="number" id="receive_encargos" step="0.01" min="0" value="0.00">
              </div>
            </div>

            <!-- Descrição -->
            <div class="fields-inline fields-gap-2">
              <div class="fields fields-w-full fields-h-5 fields-p-left-10">
                <label for="receive_descricao">Descrição</label>
                <input type="text" id="receive_descricao" readonly>
              </div>
            </div>

            <!-- Observação -->
            <div class="fields-inline fields-gap-2">
              <div class="fields fields-w-full fields-h-5 fields-p-left-10">
                <label for="receive_observacao">Observações</label>
                <textarea id="receive_observacao" rows="3"></textarea>
              </div>
            </div>

            <!-- Anexo -->
            <div class="fields-inline fields-gap-2">
              <div class="fields fields-w-full fields-h-6 fields-p-left-10">
                <label for="receive_anexoFile">Anexo da movimentação (opcional)</label>
                <input type="file" id="receive_anexoFile">

                <progress id="receive_anexoProgress" max="100" value="0"
                  style="width:100%; height:6px; margin-top:6px; display:none;">
                </progress>

                <small class="help-text">
                  O arquivo será vinculado à movimentação no Caixa após confirmar o recebimento.
                </small>
              </div>
            </div>

          </form>
        </div>

        <footer class="modal__footer modal-footer-color-3">
          <button type="button" id="btnCancelReceive" data-modal-close class="btn btn-new btn-sm">
            Cancelar
          </button>

          <button type="submit" form="receiveForm" id="btnConfirmReceive" class="btn btn-new btn-sm">
            Confirmar Recebimento
          </button>
        </footer>

      </section>
    </div>
  </div>


  <!-- Core (centerAlertModal, helpers globais, etc.) -->
  <script type="module" src="/public/includes/js/core.js"></script>

  <!-- JS do módulo -->
  <script type="module" src="./js/accountsReceivable.init.js"></script>

</body>

</html>

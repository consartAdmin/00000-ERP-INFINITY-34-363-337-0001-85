<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>USER EMAIL ACCOUNTS | PRODNEX ERP</title>

    <link rel="icon" type="image/png" sizes="16x16" href="/public/imagens/brasaoConsartInfinity.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/public/imagens/brasaoConsartInfinity.png">
    <link rel="icon" type="image/png" sizes="64x64" href="/public/imagens/brasaoConsartInfinity.png">

    <link rel="stylesheet" href="/public/includes/css/style.css">

    <link rel="stylesheet" href="/public/userEmailAccounts/userEmailAccounts.css" />

</head>

<body class="consart-theme p-page pw-page--full ph-page--xr">
    <main class="consart-container consart-container--full consart-container--ultraslim">

        <div class="header header-h-5">
            <div class="fields-inline fields-gap-3">
                <div class="fields fields-h-6 fields-w-full fields-font-3">
                    <div>
                        <h2>Vínculo de Usuários x Contas de E-mail</h2>
                        <p class="subtitle">
                            Defina quais contas de e-mail cada usuário pode acessar, enviar e usar como padrão.
                        </p>
                    </div>
                    <div class="btn-position-right btn-gap-3">
                        <button id="btnNovo" class="btn btn-new btn-sm" type="button">Novo vínculo</button>
                        <button id="btnAtualizar" class="btn btn-new btn-sm" type="button">Atualizar</button>
                    </div>
                </div>
            </div>

            <div class="fields-inline fields-gap-3">
                <div class="fields fields-h-6 fields-w-12 fields-font-3">
                    <label for="filtroBusca">Busca</label>
                    <input id="filtroBusca" type="text" placeholder="Usuário, e-mail, label, id..."
                        autocomplete="off" />
                </div>

                <div class="fields fields-h-6 fields-w-12 fields-font-3">
                    <label for="filtroUser">Usuário</label>
                    <select id="filtroUser">
                        <option value="">Todos</option>
                    </select>
                </div>

                <div class="fields fields-h-6 fields-w-12 fields-font-3">
                    <label for="filtroEmailAccount">Conta de e-mail</label>
                    <select id="filtroEmailAccount">
                        <option value="">Todas</option>
                    </select>
                </div>

                <div class="fields fields-h-6 fields-w-12 fields-font-3">
                    <label for="filtroDefault">É padrão?</label>
                    <select id="filtroDefault">
                        <option value="">Todos</option>
                        <option value="true">Sim</option>
                        <option value="false">Não</option>
                    </select>
                </div>

                <div class="fields fields-h-6 fields-w-12 fields-font-3">
                    <label for="filtroCanRead">Pode ler?</label>
                    <select id="filtroCanRead">
                        <option value="">Todos</option>
                        <option value="true">Sim</option>
                        <option value="false">Não</option>
                    </select>
                </div>

                <div class="fields fields-h-6 fields-w-12 fields-font-3">
                    <label for="filtroCanSend">Pode enviar?</label>
                    <select id="filtroCanSend">
                        <option value="">Todos</option>
                        <option value="true">Sim</option>
                        <option value="false">Não</option>
                    </select>
                </div>

                <div class="btn-inline btn-gap-3">
                    <button id="btnFiltrar" class="btn btn-new btn-sm" type="button">Aplicar filtros</button>
                    <button id="btnLimparFiltros" class="btn btn-new btn-sm" type="button">Limpar</button>
                </div>
            </div>
        </div>

        <section class="table-layout-integrated">
            <div class="table-layout-integrated__filter">

                <div class="fields-inline fields-gap-3">
                    <div class="fields fields-h-6 fields-w-12 fields-font-3">
                        <h2 id="formTitle">Novo vínculo</h2>
                    </div>
                </div>

                <div class="fields-inline fields-gap-3">
                    <div class="fields fields-h-6 fields-w-12 fields-font-3">
                        <form id="linkForm" novalidate>
                            <input type="hidden" id="linkId" />
                    </div>

                    <div class="fields fields-h-6 fields-w-12 fields-font-3">
                        <label for="userId">Usuário <span class="required">*</span></label>
                        <select id="userId" required>
                            <option value="">Selecione</option>
                        </select>
                    </div>

                    <div class="fields fields-h-6 fields-w-12 fields-font-3">
                        <label for="emailAccountId">Conta de e-mail <span class="required">*</span></label>
                        <select id="emailAccountId" required>
                            <option value="">Selecione</option>
                        </select>
                    </div>

                    <div class="fields fields-h-6 fields-w-12 fields-font-3">
                        <input id="isDefault" type="checkbox" />
                        <span>Conta padrão do usuário</span>
                    </div>

                    <div class="fields fields-h-6 fields-w-12 fields-font-3">
                        <input id="canRead" type="checkbox" checked />
                        <span>Pode ler e-mails</span>
                    </div>

                    <div class="fields fields-h-6 fields-w-12 fields-font-3">
                        <input id="canSend" type="checkbox" checked />
                        <span>Pode enviar e-mails</span>
                    </div>

                    <div class="btn-inline btn-gap-3">
                        <button id="btnSalvar" class="btn btn-new btn-sm" type="submit">Salvar
                            vínculo</button>
                        <button id="btnCancelarEdicao" class="btn btn-new btn-sm" type="button">Cancelar
                            edição</button>
                    </div>
                </div>
            </div>
            </form>

            <div class="table-scroll table-height-400 table-row-h-20" data-table-settings="useremailaccounts.tablebody">
                <table class="table table-zebra table-zebra-hover table-sticky-head">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Usuário</th>
                            <th>E-mail</th>
                            <th>Label</th>
                            <th>Padrão</th>
                            <th>Ler</th>
                            <th>Enviar</th>
                            <th>Criado em</th>
                            <th class="th-actions">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr>
                            <td colspan="9" class="empty-state">Carregando...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <footer class="table-footer">

                <div class="table-footer__info">
                    <div class="summary-pill summary-pill--success summary-width-4 summary-left-space-3">
                        <span id="apTableInfo">0 Registros </span>
                    </div>
                </div>

                <div class="table-footer__pagination">
                    <button type="button" id="btnPreviousPage" class="btn btn-clean btn-sm">
                        Anterior
                    </button>

                    <span id="apPageInfo">Página 1 de 1</span>

                    <button type="button" id="btnNextPage" class="btn btn-new btn-sm">
                        Próxima
                    </button>
                </div>

                <div class="table-footer__page-size">
                    <label for="apRowsPerPage">Mostrar</label>

                    <select id="apRowsPerPage" class="table-footer__page-size-select" name="rowsPerPage">
                        <option value="10">10 linhas</option>
                        <option value="20">20 linhas</option>
                        <option value="30">30 linhas</option>
                        <option value="50" selected>50 linhas</option>
                        <option value="100">100 linhas</option>
                    </select>
                </div>

            </footer>
        </section>
    </main>

    <div id="toast" class="toast hidden"></div>

    <script type="module" src="/public/userEmailAccounts/userEmailAccounts.js"></script>
    <script type="module" src="/public/includes/js/core.js"></script>
</body>

</html>

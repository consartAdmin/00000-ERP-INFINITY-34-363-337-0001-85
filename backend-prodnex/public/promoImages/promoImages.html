<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" href="/public/imagens/brasaoConsartInfinity.png">

    <title>BANNERS PROMOÇÕES</title>

    <link rel="stylesheet" href="/public/includes/css/style.css" />

    <link rel="stylesheet" href="/promoImages/promoImages.css" />
</head>

<body>

    <main class="promo-page">
        <header class="promo-header">
            <div>
                <h1>Imagens Promocionais</h1>
                <p>Crie artes de promoção usando tabela de preço e imagens dos produtos.</p>
            </div>

            <a class="btn btn-light" href="/index.html">Voltar</a>
        </header>

        <section class="promo-grid">
            <div class="card">
                <h2>Configuração</h2>

                <label>Tabela de Preço</label>
                <select id="priceTableSelect">
                    <option value="">Carregando tabelas...</option>
                </select>

                <button id="btnOpenProductSearch" class="btn btn-primary" type="button">
                    🔎 Buscar Produto
                </button>

                <input id="productSearchInput" type="text" placeholder="Digite SKU ou descrição..." />

                <div id="productsList" class="products-list"></div>
            </div>

            <div class="card">
                <h2>Dados da Arte</h2>

                <label>Título</label>
                <input id="promoTitleInput" value="PROMOÇÃO" />

                <label>Subtítulo</label>
                <input id="promoSubtitleInput" value="BH3 Distribuidora" />

                <label>Preço De</label>
                <input id="oldPriceInput" type="number" step="0.01" placeholder="Opcional" />

                <label>Preço Promocional</label>
                <input id="promoPriceInput" type="number" step="0.01" placeholder="Usa preço da tabela se vazio" />

                <button id="btnGeneratePromo" class="btn btn-primary" disabled>
                    Gerar Imagem
                </button>

                <div id="statusBox" class="status-box hidden"></div>
            </div>

            <div class="card preview-card">
                <h2>Produto Selecionado</h2>

                <div id="selectedProductBox" class="selected-empty">
                    Nenhum produto selecionado.
                </div>

                <h2>Imagem Gerada</h2>

                <div id="generatedImageBox" class="generated-box">
                    <span>A imagem gerada aparecerá aqui.</span>
                </div>
            </div>
        </section>
    </main>

    <script type="module" src="/public/includes/js/core.js"></script>

    <script type="module" src="/promoImages/promoImages.js"></script>

</body>

</html>

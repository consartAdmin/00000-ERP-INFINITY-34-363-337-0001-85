
<!-- ╔══════════════════════════════════════════════════════════════════════╗
     ║ customerSegmentsConsart.html — Segmentos de Cliente | PRODNEX ERP         ║
     ╚══════════════════════════════════════════════════════════════════════╝ -->
<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <!-- 🟦 Favicons CONSART -->
  <link rel="icon" type="image/png" sizes="16x16"
    href="/public/imagens/brasaoConsartInfinity.png">
  <link rel="icon" type="image/png" sizes="32x32"
    href="/public/imagens/brasaoConsartInfinity.png">
  <link rel="icon" type="image/png" sizes="64x64"
    href="/public/imagens/brasaoConsartInfinity.png">
  <link rel="icon"
    href="/public/imagens/brasaoConsartInfinity.png">

  <title>SEGMENTOS DE CLIENTE | PRODNEX ERP</title>

  <!-- Design System global -->
  <link rel="stylesheet" href="/public/includes/css/style.css" />

  <!-- CSS específico da página -->
  <link rel="stylesheet" href="/public/customerSegments/customerSegments.css" />
</head>

<body class="consart-theme p-page pw-page--full ph-page--xr">

  <main class="consart-container consart-container--full consart-container--ultraslim">

    <section class="table-layout-integrated">

      <div class="table-layout-integrated__filter">

        <!-- ==========================================================
             FILTROS
             ========================================================== -->
        <form id="cs-filter-form">

          <div class="fields-inline fields-gap-3">

            <div class="fields fields-h-6 fields-w-20 fields-font-3">
              <label for="cs-search">Busca</label>

              <input
                id="cs-search"
                name="q"
                type="search"
                placeholder="Buscar por nome, código ou descrição..."
                autocomplete="off"
              />
            </div>

            <div class="fields fields-h-6 fields-w-20 fields-font-3">
              <label for="cs-active">Status</label>

              <select id="cs-active" name="active">
                <option value="">Todos</option>
                <option value="true">Ativos</option>
                <option value="false">Inativos</option>
              </select>
            </div>

            <div class="btn-inline btn-position-right">

              <button
                type="submit"
                class="btn btn-new btn-sm">
                Filtrar
              </button>

              <button
                type="button"
                id="cs-btn-clear"
                class="btn btn-new btn-sm">
                Limpar
              </button>

              <button
                type="button"
                id="cs-btn-new"
                class="btn btn-new btn-sm">
                + Novo Segmento
              </button>

            </div>

          </div>

        </form>
        <!-- ==========================================================
             FIM DOS FILTROS
             ========================================================== -->

        <div>
          <h2>Segmentos cadastrados</h2>
        </div>

      </div>

      <!-- ============================================================
           TABELA
           ============================================================ -->

      <div class="table-scroll table-height-500 table-row-h-20" data-table-settings="customersegments.table-1">

        <table class="table table-zebra table-zebra-hover table-sticky-head">

          <thead>
            <tr>
              <th class="cs-col-code">Código</th>
              <th class="cs-col-name">Nome</th>
              <th class="cs-col-desc">Descrição</th>
              <th class="cs-col-active">Ativo</th>
              <th class="cs-col-actions">Ações</th>
            </tr>
          </thead>

          <tbody data-segments-table-body>
            <!-- Linhas criadas via JS -->
          </tbody>

        </table>

        <div
          class="cs-empty-state"
          id="cs-empty-state"
          hidden>
          Nenhum segmento encontrado com os filtros atuais.
        </div>

      </div>

      <!-- ============================================================
           FOOTER / PAGINAÇÃO
           ============================================================ -->

      <footer class="table-footer">

        <div class="table-footer__info">

          <div class="summary-pill summary-pill--success summary-width-4 summary-left-space-3">
            <span id="apTableInfo">
              0 Registros
            </span>
          </div>

        </div>

        <div class="table-footer__pagination">

          <button
            type="button"
            id="btnPreviousPage"
            class="btn btn-clean btn-sm">
            Anterior
          </button>

          <span id="apPageInfo">
            Página 1 de 1
          </span>

          <button
            type="button"
            id="btnNextPage"
            class="btn btn-new btn-sm">
            Próxima
          </button>

        </div>

        <div class="table-footer__page-size">

          <label for="apRowsPerPage">
            Mostrar
          </label>

          <select
            id="apRowsPerPage"
            class="table-footer__page-size-select"
            name="rowsPerPage">

            <option value="10">
              10 linhas
            </option>

            <option value="20">
              20 linhas
            </option>

            <option value="30">
              30 linhas
            </option>

            <option value="50" selected>
              50 linhas
            </option>

            <option value="100">
              100 linhas
            </option>

          </select>

        </div>

      </footer>

    </section>

  </main>

  <!-- ================================================================
       MODAL DE CRIAÇÃO / EDIÇÃO
       ================================================================ -->

  <div
    id="cs-modal-backdrop"
    class="cs-modal-backdrop cs-hidden">

    <div class="cs-modal">

      <header class="cs-modal-header">

        <h2 id="cs-modal-title">
          Novo Segmento
        </h2>

        <button
          type="button"
          id="cs-modal-close"
          class="cs-modal-close">
          &times;
        </button>

      </header>

      <!-- ==========================================================
           FORMULÁRIO DO MODAL
           ========================================================== -->

      <form
        id="cs-form"
        class="cs-form">

        <input
          type="hidden"
          id="cs-id" />

        <div class="cs-form-grid">

          <div class="cs-form-group">

            <label for="cs-segment-code">
              Código do Segmento
            </label>

            <input
              id="cs-segment-code"
              name="segment_code"
              type="text"
              maxlength="30"
              placeholder="Gerado automaticamente"
              readonly />

          </div>

          <div class="cs-form-group">

            <label for="cs-segment-name">
              Nome do Segmento
              <span class="cs-required">*</span>
            </label>

            <input
              id="cs-segment-name"
              name="segment_name"
              type="text"
              maxlength="120"
              placeholder="Ex.: Varejo, Atacado, Clientes VIP..."
              required />

          </div>

          <div class="cs-form-group cs-form-group-full">

            <label for="cs-description">
              Descrição
            </label>

            <textarea
              id="cs-description"
              name="description"
              rows="3"
              placeholder="Observações adicionais sobre o segmento..."></textarea>

          </div>

          <div class="cs-form-group cs-form-group-inline">

            <label class="cs-switch">

              <input
                type="checkbox"
                id="cs-is-active"
                checked />

              <span class="cs-switch-slider"></span>

              <span class="cs-switch-label">
                Segmento Ativo
              </span>

            </label>

          </div>

        </div>

        <!-- ========================================================
             BOTÕES
             ======================================================== -->

        <footer class="cs-form-footer">

          <button
            type="button"
            id="cs-btn-cancel"
            class="btn btn-toolbar btn-sm">
            Cancelar
          </button>

          <button
            type="submit"
            class="btn btn-toolbar btn-sm">
            Salvar
          </button>

        </footer>

      </form>

    </div>

  </div>

  <!-- apiBase deve refletir o MESMO esquema da página -->
  <script>window.ERP_COMPANY = 'CONSART';</script>
  <script src="/public/includes/js/erpCompany.js"></script>
  <script src="/config/apiBase.js"></script>

  <!-- Core global -->
  <script
    type="module"
    src="/public/includes/js/core.js"></script>

  <!-- JS específico da página -->
  <script
    type="module"
    src="/public/customerSegments/customerSegments.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="icon" type="image/png" href="/public/imagens/brasaoConsartInfinity.png" />

  <title>SALDOS BANCÁRIOS | PRODNEX ERP</title>

  <link rel="stylesheet" href="/public/includes/css/style.css">
  <link rel="stylesheet" href="./css/bankAccountsBalance.css?v=1">
</head>


<body class="consart-theme p-page pw-page--full ph-page--xr">

  <main class="consart-container consart-container--full consart-container--ultraslim">

    <!-- ================================================================
         SALDO ATUAL POR CONTA
    ================================================================= -->

    <section class="bab-cards" id="babCards" aria-live="polite">
      <div class="bab-card bab-card--loading">Carregando saldos...</div>
    </section>


    <section class="table-layout-integrated">


      <!-- ================================================================
           FILTERS
      ================================================================= -->

      <div class="table-layout-integrated-filter">

        <form id="babFilterForm" class="header fields-inline fields-gap-3">

          <div class="fields fields-w-20 fields-h-6">
            <label for="babFilterAccount">Conta bancária</label>
            <select id="babFilterAccount">
              <option value="">Todas</option>
            </select>
          </div>

          <div class="fields fields-w-10 fields-h-6">
            <label for="babFilterFrom">De</label>
            <input id="babFilterFrom" type="date">
          </div>

          <div class="fields fields-w-10 fields-h-6">
            <label for="babFilterTo">Até</label>
            <input id="babFilterTo" type="date">
          </div>

          <div class="btn-inline">
            <button class="btn btn-new btn-sm" type="submit">Aplicar</button>
            <button class="btn btn-clean btn-sm" id="babFilterClear" type="button">Limpar</button>
          </div>

          <div class="btn-inline btn-position-right">
            <button class="btn btn-new btn-sm" id="babNew" type="button">Nova Conferência</button>
          </div>

        </form>

      </div>


      <!-- ================================================================
           TABLE — HISTÓRICO DE CONFERÊNCIAS
      ================================================================= -->

      <div class="table-scroll table-height-flex" data-table-settings="bankaccountsbalance.babtablebody">

        <table class="table table-zebra table-zebra-hover table-sticky-head">

          <thead>
            <tr>
              <th>Data</th>
              <th>Conta</th>
              <th>Saldo do extrato</th>
              <th>Saldo do sistema</th>
              <th>Diferença</th>
              <th>Observação</th>
              <th>Registrado por</th>
              <th>Ações</th>
            </tr>
          </thead>

          <tbody id="babTableBody"></tbody>

        </table>

      </div>


      <footer class="table-footer">

        <div class="table-footer__info">
          <div class="summary-pill summary-pill--success summary-width-4 summary-left-space-3">
            <span id="babTableInfo">0 registros</span>
          </div>
        </div>

      </footer>

    </section>

  </main>


  <!-- ==================================================================
       MODAL — CONFERÊNCIA DE SALDO
  =================================================================== -->

  <div id="babModal" class="modal" aria-hidden="true">

    <div class="modal__backdrop" data-modal-close></div>

    <div class="modal__dialog">

      <section class="modal__panel modal-width-5" role="dialog" aria-modal="true"
        aria-labelledby="babModalTitle">

        <header class="modal__header modal-header-color-3">
          <h3 id="babModalTitle" class="modal__title">Conferir Saldo</h3>
          <button class="modal__close" type="button" data-modal-close aria-label="Fechar" title="Fechar">
            &times;
          </button>
        </header>

        <div class="modal__body">

          <form id="babForm" class="modal-section" novalidate>

            <input id="babId" type="hidden">

            <div class="modal-form-grid modal-form-grid--3">

              <div class="fields fields-h-6">
                <label for="babAccount">Conta bancária *</label>
                <select id="babAccount" required></select>
              </div>

              <div class="fields fields-h-6">
                <label for="babDate">Data (fim do dia) *</label>
                <input id="babDate" type="date" required>
              </div>

              <div class="fields fields-h-6">
                <label for="babBalance">Saldo do extrato (R$) *</label>
                <input id="babBalance" type="number" step="0.01" inputmode="decimal"
                  placeholder="0,00" required>
              </div>

            </div>

            <div class="bab-preview" id="babPreview" aria-live="polite"></div>

            <div class="fields">
              <label for="babNotes">Observação</label>
              <textarea id="babNotes" rows="3" maxlength="2000"
                placeholder="Ex.: saldo conferido no app do banco"></textarea>
            </div>

          </form>

        </div>

        <footer class="modal__footer modal-footer-color-3">
          <button class="btn btn-cancel btn-sm" type="button" data-modal-close>Cancelar</button>
          <button class="btn btn-save btn-sm" type="submit" form="babForm">Salvar</button>
        </footer>

      </section>

    </div>

  </div>


  <!-- ==================================================================
       SCRIPTS
  =================================================================== -->

  <script type="module" src="/public/includes/js/core.js"></script>

  <script type="module" src="./js/bankAccountsBalance.init.js?v=1"></script>

</body>

</html>

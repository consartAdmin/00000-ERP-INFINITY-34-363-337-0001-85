<!DOCTYPE html>
<html lang="pt-BR" class="page-painel-nfce">
<head>
  <meta charset="UTF-8" />
  <title>Painel NFC-e | PRODNEX ERP</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- 🟦 Favicons CONSART (ajuste o caminho se precisar) -->
  <link rel="icon" type="image/png" sizes="16x16" href="/public/imagens/brasaoConsartInfinity.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/public/imagens/brasaoConsartInfinity.png">
  <link rel="icon" type="image/png" sizes="64x64" href="/public/imagens/brasaoConsartInfinity.png">

  <!-- CSS específico do painel NFC-e -->
  <link rel="stylesheet" href="./painelNfce.css" />
</head>
<body class="c-page c-page-painel-nfce">
  <main class="c-main">
    <section class="nfce-shell">
      <!-- Header -->
      <header class="nfce-header">
        <div>
          <h1 class="nfce-title">Painel NFC-e (PlugNotas)</h1>
          <p class="nfce-subtitle">
            Consulte rapidamente o <strong>resumo da NFC-e</strong> pela
            <span class="accent">chave, ID PlugNotas ou protocolo</span>.
          </p>
        </div>
      </header>

      <!-- Card de busca -->
      <section class="nfce-search-card">
        <form id="nfce-search-form" class="nfce-search-form">
          <div class="nfce-field-group">
            <label for="nfce-id" class="nfce-label">
              ID / Chave / Protocolo NFC-e
            </label>
            <input
              id="nfce-id"
              name="nfce-id"
              type="text"
              class="nfce-input"
              placeholder="Ex: chave da NFC-e, ID PlugNotas ou protocolo de autorização"
              required
            />
          </div>

          <div class="nfce-actions">
            <button type="submit" class="btn btn-primary">
              Buscar resumo
            </button>
            <button type="button" id="nfce-clear" class="btn btn-ghost">
              Limpar
            </button>
          </div>
        </form>

        <p class="nfce-tip">
          Dica: cole aqui a <strong>chave NFC-e</strong> gerada no PDV, ou o
          <strong>ID</strong> retornado pela API da PlugNotas, ou ainda o
          <strong>protocolo</strong> de autorização.
        </p>
      </section>

      <!-- Área de status / mensagens -->
      <section class="nfce-status-area">
        <div id="nfce-status-message" class="nfce-status-message hidden"></div>
      </section>

      <!-- Resultados -->
      <section id="nfce-results" class="nfce-results hidden">
        <header class="nfce-results-header">
          <h2>Resumo da NFC-e</h2>
          <span id="nfce-results-count" class="nfce-results-count"></span>
        </header>

        <div id="nfce-results-list" class="nfce-results-list">
          <!-- Cards gerados via painelNfce.js -->
        </div>
      </section>
    </section>
  </main>

  <!-- Base da API (segue padrão dos outros módulos do ERP) -->
  <script>
    window.apiBase = window.apiBase || window.API_BASE || window.location.origin;
  </script>

  <!-- JS do painel NFC-e -->
  <script type="module" src="./painelNfce.js"></script>
</body>
</html>

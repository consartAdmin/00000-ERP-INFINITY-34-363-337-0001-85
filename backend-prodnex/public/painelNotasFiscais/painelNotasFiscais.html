<!-- 📄 painelNotasFiscais.html – Painel de Notas Fiscais (FULL FINAL) -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Painel de Notas Fiscais – PRODNEX ERP</title>
  <link rel="icon" href="/public/imagens/brasaoConsartInfinity.png" />

  <!-- CONSART Design System -->
  <link rel="stylesheet" href="/public/includes/css/style.css" />

  <!-- Estilos da página -->
  <link rel="stylesheet" href="painelNotasFiscais.css" />
</head>

<body class="consart-theme c-page">
  <main class="c-main">
    <div class="c-container c-container--2xl">

      <!-- Barra de busca sticky -->
      <section class="sticky-toolbar" role="search" aria-label="Buscar notas fiscais">
        <span id="totalArquivos" aria-live="polite" class="muted">Total de Arquivos: 0</span>
        <div class="sp"></div>

        <select id="filtroCampo" class="input" aria-label="Filtrar por campo">
          <option value="all">Todos</option>
          <option value="cliente">👤 Cliente (Destinatário)</option>
          <option value="numero"># Nº NF</option>
          <option value="valor">💰 Valor NF</option>
        </select>

        <input
          id="inputBusca"
          type="search"
          placeholder="Buscar por arquivo, cliente, CNPJ/CPF, Nº NF ou Valor…"
          autocomplete="off"
          aria-label="Buscar notas fiscais"
        />

        <button id="btnBuscar" type="button" class="btn btn-pastel-primary">Buscar</button>
      </section>

      <section class="card">
        <div class="c-scroll c-scroll--table">
          <table class="tabela-xmls">
            <thead>
              <tr>
                <th style="width: 28%;">📁 Nome do Arquivo</th>
                <th style="width: 20%;">👤 Cliente (Destinatário)</th>
                <th style="width: 14%;">🪪 CNPJ/CPF Dest.</th>
                <th style="width: 8%;"># Nº NF</th>
                <th style="width: 10%;">💰 Valor NF</th>
                <th style="width: 12%;">🗓️ Emissão</th>
                <th style="width: 18%;">🧾 Ações</th>
              </tr>
            </thead>

            <tbody id="tabelaXMLs">
              <tr><td colspan="7">Carregando…</td></tr>
            </tbody>
          </table>
        </div>

        <!-- Paginação -->
        <div class="paginacao">
          <button id="btnAnterior" type="button" class="btn btn-pastel-primary">« Anterior</button>
          <span id="infoPagina" class="muted">Página 1</span>
          <button id="btnProxima" type="button" class="btn btn-pastel-primary">Próxima »</button>
        </div>
      </section>
    </div>
  </main>

  <!-- Globais -->
  <script type="module" src="/public/includes/js/core.js"></script>

  <!-- Script da página -->
  <script src="painelNotasFiscais.js" defer></script>
</body>
</html>

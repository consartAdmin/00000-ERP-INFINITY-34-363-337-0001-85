<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <title>NECESSIDADE DE MATERIAIS | PRODNEX ERP</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="icon" type="image/png" sizes="16x16" href="/public/imagens/brasaoConsartInfinity.png">
  <link rel="stylesheet" href="/public/includes/css/style.css" />
</head>

<body class="consart-theme p-page pw-page--full ph-page--xr">
  <main class="consart-container consart-container--full consart-container--ultraslim">

    <section class="table-layout-integrated" aria-label="Necessidade de materiais">
      <div class="table-layout-integrated__filter">
        <div class="summary summary--between summary-gap-8">
          <h4 class="table-layout-integrated__filter-title">Necessidade de Materiais (MRP)</h4>
          <small>Soma o que as OPs abertas ainda vão consumir e compara com o estoque atual e o estoque mínimo</small>
        </div>

        <div class="fields-inline fields-inline-wrap fields-gap-3">
          <div class="fields fields-h-6 fields-w-16 fields-font-3">
            <label for="search">Buscar</label>
            <input id="search" type="search" placeholder="Código ou descrição do componente..." autocomplete="off" />
          </div>

          <div class="fields fields-h-6 fields-w-10 fields-font-3">
            <label for="onlyShortage">Mostrar</label>
            <select id="onlyShortage">
              <option value="1" selected>Só o que falta comprar</option>
              <option value="0">Todos os componentes</option>
            </select>
          </div>

          <div class="btn-inline btn-gap-2 btn-position-right">
            <button id="btnExport" type="button" class="btn btn-toolbar btn-sm"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg><span>Exportar CSV</span></button>
            <button id="btnRefresh" type="button" class="btn btn-load btn-sm"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 5v6h-6"/></svg><span>Atualizar</span></button>
          </div>
        </div>
      </div>

      <div class="table-scroll table-height-flex table-row-h-20" data-table-settings="pcp.mrp">
        <table class="table table-zebra table-zebra-hover table-sticky-head">
          <thead>
            <tr>
              <th class="table-col-w-2">Componente</th>
              <th class="th-left">Descrição</th>
              <th class="table-col-w-2 th-right">Necessário</th>
              <th class="table-col-w-2 th-right">Estoque</th>
              <th class="table-col-w-2 th-right">Est. mínimo</th>
              <th class="table-col-w-2 th-right">Comprar</th>
              <th class="table-col-w-2 th-right">Valor estimado</th>
              <th class="table-col-w-1">OPs</th>
              <th class="table-col-w-2">1ª entrega</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
      <footer class="table-footer">
        <div class="table-footer__info">
          <div class="summary-pill summary-pill--success summary-left-space-3">
            <span id="mrpTableInfo">Carregando...</span>
          </div>
          <div class="summary-pill summary-pill--info summary-left-space-3">
            <span>Total a comprar: <strong id="mrpTotal">R$ 0,00</strong></span>
          </div>
        </div>
        <div class="table-footer__pagination">
          <button type="button" id="mrpPrevPage" class="btn btn-clean btn-sm">Anterior</button>
          <span id="mrpPageInfo">Página 1 de 1</span>
          <button type="button" id="mrpNextPage" class="btn btn-new btn-sm">Próxima</button>
        </div>
        <div class="table-footer__page-size">
          <label for="mrpRowsPerPage">Mostrar</label>
          <select id="mrpRowsPerPage" class="table-footer__page-size-select">
            <option value="10">10 linhas</option>
            <option value="20">20 linhas</option>
            <option value="50" selected>50 linhas</option>
            <option value="100">100 linhas</option>
          </select>
        </div>
      </footer>
    </section>
  </main>

  <script type="module" src="/public/includes/js/core.js"></script>
  <script type="module" src="/public/pcpMrp/js/pcpMrp.js?v=dock-01"></script>
</body>

</html>

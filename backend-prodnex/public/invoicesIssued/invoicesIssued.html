<!-- ╔══════════════════════════════════════════════════════════════════════╗
     ║ invoicesIssued.html — Notas Fiscais Emitidas                       ║
     ║ PRODNEX ERP                                                        ║
     ╚══════════════════════════════════════════════════════════════════════╝ -->

<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/png" href="/public/imagens/brasaoConsartInfinity.png">

    <title>NOTAS FISCAIS | PRODNEX ERP</title>

    <link rel="stylesheet" href="/public/includes/css/style.css" />
    <link rel="stylesheet" href="/public/invoicesIssued/invoicesIssued.css" />
</head>

<body class="consart-theme p-page pw-page--full ph-page--xr">
    <main class="consart-container consart-container--full consart-container--ultraslim">
        <!--Fields-->
        <section class="table-layout-integrated table-max-height-800">
            <div class="table-layout-integrated__filter">

                <!-- ========================================================== -->
                <!-- KPI                                                        -->
                <!-- ========================================================== -->

                <section class="cards">

                    <article class="card">
                        <span>Total de notas</span>
                        <strong id="kpiTotal">0</strong>
                    </article>

                    <article class="card">
                        <span>Autorizadas</span>
                        <strong id="kpiAuthorized">0</strong>
                    </article>

                    <article class="card">
                        <span>Canceladas</span>
                        <strong id="kpiCancelled">0</strong>
                    </article>

                    <article class="card">
                        <span>Valor total</span>
                        <strong id="kpiAmount">R$ 0,00</strong>
                    </article>

                </section>

                <!-- ====================================================== -->
                <!-- FILTROS                                                -->
                <!-- ====================================================== -->

                <div class="fields-inline fields-gap-3">

                    <div class="fields fields-h-6 fields-w-20 fields-font-3">
                        <input id="searchInput" type="text"
                            placeholder="Buscar por cliente, CNPJ, pedido, chave ou número NF-e..." />
                    </div>

                    <div class="fields fields-h-6 fields-w-20 fields-font-3">
                        <select id="statusFilter">
                            <option value="TODOS">Carregando status...</option>
                        </select>
                    </div>

                    <div class="fields fields-h-6 fields-w-20 fields-gap-3"> <date-range-field id="dateFilter"
                            class="fields fields-h-6 fields-w-20 fields-font-3" label="Emissão" name-start="dateFrom"
                            name-end="dateTo" locale="pt-BR">
                        </date-range-field>

                        <input type="hidden" id="filterFromDue">
                        <input type="hidden" id="filterToDue">
                    </div>

                    <div class="btn-inline">
                        <button id="btnSearch" class="btn btn-new btn-sm" type="button">Pesquisar</button>
                    </div>

                    <div class="btn-inline btn-position-right">
                        <button id="btnSync" class="btn btn-toolbar btn-sm" type="button" title="Sincronizar NF-e">
                            <span aria-hidden="true">🔄</span>
                            <span data-btn-label>Sincronizar</span>
                        </button>

                        <button id="btnDownloadXmls" class="btn btn-toolbar btn-sm" type="button" title="Baixar XMLs">
                            <img src="/iconsImagens/xmlDanfe.png" alt="" width="20" height="20" aria-hidden="true" />
                            <span>Baixar XMLs</span>
                        </button>

                        <button id="btnDownloadPdfs" class="btn btn-toolbar btn-sm" type="button" title="Baixar PDFs">
                            <img src="/iconsImagens/pdf.png" alt="" width="20" height="20" aria-hidden="true" />
                            <span>Baixar PDFs</span>
                        </button>
                    </div>

                </div>
            </div>
            </div>

            <!-- ====================================================== -->
            <!-- STATUS                                                 -->
            <!-- ====================================================== -->

            <div id="syncStatus" class="sync-status is-hidden"></div>

            <!--===================================================-->
            <!-- TABLE                                               -->
            <!-- =================================================== -->

            <div class="table-scroll table-height-flex table-row-h-28" data-table-settings="invoicesissued.invoicesissuedtable">

                <table id="invoicesIssuedTable" class="table table-zebra table-zebra-hover table-sticky-head">

                    <thead>
                        <tr>

                            <th class="table-sortable" data-sort-column="id" aria-sort="none">
                                <button type="button" class="table-sort-button" data-sort-button>
                                    ID
                                    <span data-sort-icon>↕</span>
                                </button>
                            </th>

                            <th class="table-sortable" data-sort-column="order_id" aria-sort="none">
                                <button type="button" class="table-sort-button" data-sort-button>
                                    Pedido
                                    <span data-sort-icon>↕</span>
                                </button>
                            </th>

                            <th class="table-sortable" data-sort-column="nfe_number" aria-sort="none">
                                <button type="button" class="table-sort-button" data-sort-button>
                                    NF-e
                                    <span data-sort-icon>↕</span>
                                </button>
                            </th>

                            <th class="table-sortable" data-sort-column="customer_name" aria-sort="none">
                                <button type="button" class="table-sort-button" data-sort-button>
                                    Cliente
                                    <span data-sort-icon>↕</span>
                                </button>
                            </th>

                            <th class="table-sortable" data-sort-column="customer_tax_id" aria-sort="none">
                                <button type="button" class="table-sort-button" data-sort-button>
                                    CNPJ/CPF
                                    <span data-sort-icon>↕</span>
                                </button>
                            </th>

                            <th class="table-sortable" data-sort-column="nfe_status" aria-sort="none">
                                <button type="button" class="table-sort-button" data-sort-button>
                                    Status
                                    <span data-sort-icon>↕</span>
                                </button>
                            </th>

                            <th class="table-sortable" data-sort-column="issued_date" aria-sort="none">
                                <button type="button" class="table-sort-button" data-sort-button>
                                    Emissão
                                    <span data-sort-icon>↕</span>
                                </button>
                            </th>

                            <th class="table-sortable" data-sort-column="total_amount" aria-sort="none">
                                <button type="button" class="table-sort-button" data-sort-button>
                                    Total
                                    <span data-sort-icon>↕</span>
                                </button>
                            </th>

                            <th>Ações</th>

                        </tr>
                    </thead>

                    <tbody id="tableBody">
                        <tr>
                            <td colspan="9" class="empty">
                                Carregando notas...
                            </td>
                        </tr>
                    </tbody>

                </table>

            </div>

            <!-- =================================================== -->
            <!-- TABLE FOOTER                                        -->
            <!-- =================================================== -->

            <footer class="table-footer">
                <div class="table-footer__info">
                    <div class="summary-pill summary-pill-success summary-width-5 summary-left-space-3">
                        <span id="apTableInfo">
                            0 Registros
                        </span>
                    </div>
                </div>

                <div class="table-footer__pagination">
                    <button id="btnPreviousPage" type="button" class="btn btn-toolbar btn-sm">
                        Anterior
                    </button>

                    <span id="pageInfo">
                        Página 1 de 1
                    </span>

                    <button id="btnNextPage" type="button" class="btn btn-toolbar btn-sm">
                        Próxima
                    </button>
                </div>
                <div class="table-footer__page-size">
                    <label for="pageSize">
                        Mostrar
                    </label>
                    <div class="fields fields-h-6 fields-w-3 fields-font-3">
                        <select id="apRowsPerPage" class="table-footer__page-size-select">
                            <option value="10">10</option>
                            <option value="20">20</option>
                            <option value="50" selected>50</option>
                            <option value="100">100</option>
                        </select>
                    </div>
                </div>
            </footer>
        </section>
    </main>

    <!-- ============================================================= -->
    <!-- MODAL NOTA FISCAL                                             -->
    <!-- ============================================================= -->

    <div id="invoiceIssuedModal" class="invoice-issued-modal is-hidden" aria-hidden="true">

        <div class="invoice-issued-modal-content">

            <div class="modal-header">

                <h2 id="modalTitle">
                    Nota Fiscal Emitida
                </h2>

                <button id="btnCloseModal" class="icon-btn" type="button">
                    ×
                </button>

            </div>

            <form id="invoiceForm" class="form-grid">

                <input type="hidden" id="invoice_id" />

                <label>
                    Pedido ID
                    <input id="order_id" type="number" />
                </label>

                <label>
                    Número NF-e
                    <input id="nfe_number" type="number" />
                </label>

                <label class="wide">
                    Chave NF-e
                    <input id="nfe_key" maxlength="44" />
                </label>

                <label>
                    Status

                    <select id="nfe_status">
                        <option value="PENDENTE">PENDENTE</option>
                    </select>
                </label>

                <label>
                    Ambiente
                    <input id="nfe_environment" placeholder="PRODUCAO / HOMOLOGACAO" />
                </label>

                <label>
                    Protocolo
                    <input id="nfe_protocol" />
                </label>

                <label>
                    Data emissão
                    <input id="issued_date" type="date" />
                </label>

                <label>
                    Valor total
                    <input id="total_amount" type="number" step="0.01" />
                </label>

                <label class="wide">
                    XML URL
                    <input id="xml_url" />
                </label>

                <label class="wide">
                    DANFE URL
                    <input id="danfe_url" />
                </label>

                <div class="modal-actions wide">

                    <button type="button" id="btnCancelModal" class="btn secondary">
                        Cancelar
                    </button>

                    <button type="submit" class="btn primary">
                        Salvar
                    </button>

                </div>

            </form>

        </div>

    </div>

    <!-- ============================================================= -->
    <!-- MODAL ENVIO DE E-MAIL                                         -->
    <!-- ============================================================= -->

    <div id="emailModal" class="modal modal-width-5 modal-height-5 is-hidden" aria-hidden="true">
        <div class="modal__backdrop"></div>

        <div class="modal__dialog">
            <section class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="emailModalTitle">
                <!-- HEADER -->

                <header class="modal__header modal-header-color-3">
                    <h3 id="emailModalTitle">
                        📧 Enviar NF-e por E-mail
                    </h3>

                    <button type="button" id="btnCloseEmailModal" data-modal-close class="btn btn-new btn-sm btn-icon"
                        aria-label="Fechar">
                        ✕
                    </button>
                </header>

                <!-- BODY -->

                <div class="modal__body">
                    <div class="modal-section">
                        <form id="emailInvoiceForm" class="fields-lines fields-v-gap-3">
                            <input type="hidden" id="emailInvoiceId" />

                            <div class="fields-inline fields-gap-3">
                                <div class="fields fields-w-full fields-h-5">
                                    <label for="emailCustomerName">
                                        Cliente
                                    </label>

                                    <input type="text" id="emailCustomerName" readonly />
                                </div>
                            </div>

                            <div class="fields-inline fields-gap-3">
                                <div class="fields fields-w-full fields-h-5">
                                    <label for="emailTo">
                                        E-mail Destinatário
                                    </label>

                                    <input type="text" id="emailTo"
                                        placeholder="cliente@email.com; financeiro@email.com" autocomplete="email"
                                        inputmode="email" aria-describedby="emailToHelp" required />

                                    <small id="emailToHelp">
                                        Para enviar a várias pessoas, separe os e-mails por vírgula ou ponto e vírgula.
                                    </small>
                                </div>
                            </div>

                            <div class="fields-inline fields-gap-3">
                                <div class="fields fields-w-full fields-h-5">
                                    <label for="emailSubject">
                                        Assunto
                                    </label>

                                    <input type="text" id="emailSubject" value="NF-e emitida — PRODNEX ERP" required />
                                </div>
                            </div>

                            <div class="fields-inline fields-gap-3">
                                <div class="fields fields-w-full fields-h-10">
                                    <label for="emailMessage">
                                        Mensagem
                                    </label>

                                    <textarea id="emailMessage" rows="10" required>Olá,

Segue em anexo a NF-e, DANFE e os boletos referentes ao seu pedido.

Atenciosamente,
PRODNEX ERP</textarea>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- FOOTER: direct child of modal__panel -->

                <footer class="modal__footer modal-footer-color-3">
                    <button type="button" id="btnCancelEmailModal" data-modal-close class="btn btn-new btn-sm">
                        Cancelar
                    </button>

                    <button type="button" id="btnSendInvoiceEmail" class="btn btn-new btn-sm">
                        📧 Enviar E-mail
                    </button>
                </footer>
            </section>
        </div>
    </div>


    <!-- ============================================================= -->
    <!-- SCRIPTS                                                       -->
    <!-- ============================================================= -->

    <script type="module" src="/public/invoicesIssued/js/invoicesIssued.init.js"></script>

</body>

</html>

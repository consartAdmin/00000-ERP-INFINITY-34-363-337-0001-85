<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <title>CENTROS DE TRABALHO | PRODNEX ERP</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="icon" type="image/png" sizes="16x16" href="/public/imagens/brasaoConsartInfinity.png">
  <link rel="stylesheet" href="/public/includes/css/style.css" />
</head>

<body class="consart-theme p-page pw-page--full ph-page--xr">
  <main class="consart-container consart-container--full consart-container--ultraslim">

    <section class="table-layout-integrated" aria-label="Centros de trabalho">
      <div class="table-layout-integrated__filter">
        <div class="summary summary--between summary-gap-8">
          <h4 class="table-layout-integrated__filter-title">Centros de Trabalho</h4>
          <small>Máquinas, células e setores onde as operações de produção acontecem</small>
        </div>

        <div class="fields-inline fields-inline-wrap fields-gap-3">
          <div class="fields fields-h-6 fields-w-16 fields-font-3">
            <label for="search">Buscar</label>
            <input id="search" type="search" placeholder="Código ou nome..." autocomplete="off" />
          </div>

          <div class="fields fields-h-6 fields-w-6 fields-font-3">
            <label for="statusFilter">Status</label>
            <select id="statusFilter">
              <option value="active" selected>Ativos</option>
              <option value="inactive">Inativos</option>
              <option value="all">Todos</option>
            </select>
          </div>

          <div class="btn-inline btn-gap-2 btn-position-right">
            <button id="btnNew" type="button" class="btn btn-new btn-sm"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Novo centro</span></button>
          </div>
        </div>
      </div>

      <div class="table-scroll table-height-flex table-row-h-20" data-table-settings="pcp.workcenters">
        <table class="table table-zebra table-zebra-hover table-sticky-head">
          <thead>
            <tr>
              <th class="table-col-w-2">Código</th>
              <th class="th-left">Nome</th>
              <th class="table-col-w-2 th-right">Custo / hora</th>
              <th class="table-col-w-2 th-right">Capacidade (h/dia)</th>
              <th class="table-col-w-2">Status</th>
              <th class="table-col-w-2">Ações</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>

      <footer class="table-footer">
        <div class="table-footer__info">
          <div class="summary-pill summary-pill--success summary-left-space-3">
            <span id="wcTableInfo">Carregando...</span>
          </div>
        </div>
        <div class="table-footer__pagination">
          <button type="button" id="wcPrevPage" class="btn btn-clean btn-sm">Anterior</button>
          <span id="wcPageInfo">Página 1 de 1</span>
          <button type="button" id="wcNextPage" class="btn btn-new btn-sm">Próxima</button>
        </div>
        <div class="table-footer__page-size">
          <label for="wcRowsPerPage">Mostrar</label>
          <select id="wcRowsPerPage" class="table-footer__page-size-select">
            <option value="10">10 linhas</option>
            <option value="20">20 linhas</option>
            <option value="50" selected>50 linhas</option>
            <option value="100">100 linhas</option>
          </select>
        </div>
      </footer>
    </section>
  </main>

  <!-- MODAL — NOVO / EDITAR CENTRO DE TRABALHO -->
  <div class="modal modal-width-5 modal-header-color-3 modal-footer-color-3" id="modal" role="dialog"
    aria-modal="true" aria-labelledby="modalTitle" aria-hidden="true">
    <div class="modal__backdrop" data-modal-close="backdrop"></div>
    <div class="modal__dialog">
      <section class="modal__panel" role="document">
        <header class="modal__header">
          <h3 class="modal__title" id="modalTitle">Novo centro de trabalho</h3>
          <button type="button" class="modal__close" data-modal-close aria-label="Fechar">✕</button>
        </header>

        <form id="form" class="modal__body modal-section" autocomplete="off">
          <input id="workCenterId" type="hidden" />

          <div class="modal-form-grid modal-form-grid--6 fields-value-bold">
            <div class="fields fields-h-6 fields-w-full fields-font-3 modal-field--span-2">
              <label for="code">Código *</label>
              <input id="code" type="text" maxlength="20" placeholder="Ex.: INJ01" required />
            </div>

            <div class="fields fields-h-6 fields-w-full fields-font-3 modal-field--span-4">
              <label for="name">Nome *</label>
              <input id="name" type="text" maxlength="100" placeholder="Ex.: Injetora 01" required />
            </div>

            <div class="fields fields-h-6 fields-w-full fields-font-3 modal-field--span-2">
              <label for="hourlyCost">Custo por hora (R$)</label>
              <input id="hourlyCost" type="number" step="0.01" min="0" value="0" />
            </div>

            <div class="fields fields-h-6 fields-w-full fields-font-3 modal-field--span-2">
              <label for="capacity">Capacidade (h/dia)</label>
              <input id="capacity" type="number" step="0.5" min="0" value="8" />
            </div>

            <div class="fields fields-h-6 fields-w-full fields-font-3 modal-field--span-2">
              <label for="isActive">Status</label>
              <select id="isActive">
                <option value="true" selected>Ativo</option>
                <option value="false">Inativo</option>
              </select>
            </div>

            <div class="fields fields-h-6 fields-w-full fields-font-3 modal-field--span-full">
              <label for="notes">Observações</label>
              <input id="notes" type="text" />
            </div>
          </div>

          <small>O custo por hora é usado no custo das operações da ficha técnica.</small>
        </form>

        <footer class="modal__footer">
          <button type="button" class="btn btn-toolbar btn-sm" data-modal-close><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg><span>Cancelar</span></button>
          <button type="submit" form="form" class="btn btn-new btn-sm"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v5h7V3"/><path d="M8 21v-7h8v7"/></svg><span>Salvar</span></button>
        </footer>
      </section>
    </div>
  </div>

  <script type="module" src="/public/includes/js/core.js"></script>
  <script type="module" src="/public/pcpWorkCenters/js/pcpWorkCenters.js?v=dock-01"></script>
</body>

</html>

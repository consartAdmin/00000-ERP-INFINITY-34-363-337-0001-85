<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- 🟦 Favicons CONSART -->
  <link rel="icon" type="image/png" sizes="16x16" href="/public/imagens/brasaoConsartInfinity.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/public/imagens/brasaoConsartInfinity.png">
  <link rel="icon" type="image/png" sizes="64x64" href="/public/imagens/brasaoConsartInfinity.png">
  <link rel="icon" href="/public/imagens/brasaoConsartInfinity.png">

  <title>SENHAS DOS MÓDULOS | PRODNEX ERP</title>

  <!-- style.css já importa table.css, fields.css e modals.css -->
  <link rel="stylesheet" href="/public/includes/css/style.css" />

  <link rel="stylesheet" href="/public/modulePasswords/modulePasswords.css" />
</head>

<body class="consart-theme p-page pw-page--full ph-page--xr">
  <main class="consart-container consart-container--full consart-container--ultraslim">

    <section class="table-layout-integrated table-max-height-700">
      <div class="table-layout-integrated__filter">
        <div class="fields-inline fields-inline-scroll fields-gap-3">

          <!-- Buscar -->
          <div class="fields fields-h-5 fields-w-20 fields-font-3">
            <span class="label">Buscar</span>
            <input id="q" type="text" placeholder="Módulo, ação ou descrição..." autocomplete="off" />
          </div>

          <!-- Botões -->
          <div class="btn-inline btn-gap-4">
            <button id="btnNew" class="btn btn-new btn-sm" type="button">
              ➕ Nova Senha
            </button>

            <button id="btnReload" class="btn btn-load btn-sm" type="button">
              Recarregar
            </button>

            <button id="btnBack" class="btn btn-back btn-sm" type="button">
              Voltar
            </button>
          </div>

        </div>
      </div>

      <!-- ✅ Área rolável padrão CONSART -->
      <div class="table-scroll table-height-flex table-row-h-28">
        <table id="modulePasswordsTable" class="table table-fixed table-zebra table-zebra-hover table-sticky-head">
          <thead>
            <tr>
              <th class="table-col-w-2">ID</th>
              <th class="table-col-w-6">Módulo</th>
              <th class="table-col-w-5">Ação</th>
              <th class="table-col-w-12">Descrição</th>
              <th class="table-col-w-5">Senha</th>
              <th class="table-col-w-3">Ativa</th>
              <th class="table-col-w-6">Atualizado em</th>
              <th class="table-col-w-4">Usuário (ID)</th>
              <th class="table-col-w-5">Ações</th>
            </tr>
          </thead>

          <tbody id="tbody">
            <!-- Preenchido via JavaScript -->
          </tbody>
        </table>
      </div>

      <footer class="table-footer">
        <div class="table-footer__info">
          <div class="summary-pill summary-pill--success summary-width-4 summary-left-space-3">
            <span id="tableInfo">0 registros</span>
          </div>
        </div>
      </footer>
    </section>
  </main>

  <!-- ══════════════════════════════════════════════════════ -->
  <!-- MODAL — Nova / Editar senha (padrão global modals.css)  -->
  <!-- ══════════════════════════════════════════════════════ -->
  <div id="passwordModal" class="modal" aria-hidden="true">
    <div id="passwordModalBackdrop" class="modal__backdrop"></div>

    <div class="modal__dialog">
      <div class="modal__panel modal__panel--md modal-header-color-2 modal-footer-color-1" role="dialog"
        aria-modal="true" aria-labelledby="passwordModalTitle">
        <header class="modal__header">
          <h3 id="passwordModalTitle" class="modal__title">Senha do Módulo</h3>
          <button id="btnCloseModal" type="button" class="modal__close" aria-label="Fechar modal"
            title="Fechar">×</button>
        </header>

        <form id="passwordForm" class="modal__body" autocomplete="off">
          <div class="modal-form-grid modal-form-grid--2">

            <div class="fields fields-h-6 fields-w-full fields-font-3">
              <label for="module_code">Módulo</label>
              <input id="module_code" name="module_code" type="text" placeholder="Ex.: CUSTOMERS" maxlength="60" />
            </div>

            <div class="fields fields-h-6 fields-w-full fields-font-3">
              <label for="action_code">Ação</label>
              <input id="action_code" name="action_code" type="text" placeholder="Ex.: EXPORT" maxlength="60" />
            </div>

            <div class="fields fields-h-6 fields-w-full fields-font-3 modal-field--span-full">
              <label for="description">Descrição</label>
              <input id="description" name="description" type="text" maxlength="255"
                placeholder="Ex.: Listagem de Clientes — Exportar PDF/Excel" />
            </div>

            <div class="fields fields-h-6 fields-w-full fields-font-3">
              <label for="password">Nova senha</label>
              <input id="password" name="password" type="password" autocomplete="new-password" />
              <small id="passwordHelp" class="fields-help"></small>
            </div>

            <div class="fields fields-h-6 fields-w-full fields-font-3">
              <label for="password_confirm">Confirmar nova senha</label>
              <input id="password_confirm" name="password_confirm" type="password" autocomplete="new-password" />
            </div>

            <label class="module-passwords-check modal-field--span-full">
              <input id="is_active" name="is_active" type="checkbox" checked />
              <span>Ativa — quando desmarcada, o módulo não pede senha</span>
            </label>

          </div>
        </form>

        <footer class="modal__footer">
          <div class="modal-spacer"></div>
          <button id="btnCancelModal" type="button" class="btn btn-secondary btn-sm">Cancelar</button>
          <button id="btnSave" type="submit" form="passwordForm" class="btn btn-save btn-sm">Salvar</button>
        </footer>
      </div>
    </div>
  </div>

  <script type="module" src="/public/includes/js/core.js"></script>

  <script type="module" src="/public/modulePasswords/js/modulePasswords.init.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- 🟦 Favicons CONSART -->
  <link rel="icon" type="image/png" sizes="16x16" href="/public/imagens/brasaoConsartInfinity.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/public/imagens/brasaoConsartInfinity.png">
  <link rel="icon" type="image/png" sizes="64x64" href="/public/imagens/brasaoConsartInfinity.png">
  <link rel="icon" href="/public/imagens/brasaoConsartInfinity.png">

  <title>BANCOS | PRODNEX ERP</title>

  <link rel="stylesheet" href="/public/includes/css/style.css">
</head>


<body class="consart-theme p-page pw-page--full ph-page--xr">

  <main class="consart-container consart-container--full consart-container--ultraslim">

    <section class="table-layout-integrated">

      <!-- ================================================================
           FILTERS
      ================================================================= -->

      <div class="table-layout-integrated-filter">

        <form id="banksFilterForm" class="header fields-inline fields-gap-3">

          <div class="fields fields-w-20 fields-h-6">

            <label for="banksSearch">
              Buscar
            </label>

            <input id="banksSearch" type="search" placeholder="Nome ou código do banco">

          </div>


          <div class="fields fields-w-8 fields-h-6">

            <label for="banksActive">
              Status
            </label>

            <select id="banksActive">

              <option value="true">
                Ativos
              </option>

              <option value="">
                Todos
              </option>

              <option value="false">
                Inativos
              </option>

            </select>

          </div>


          <div class="btn-inline">

            <button class="btn btn-new btn-sm" type="submit">
              Aplicar
            </button>

            <button class="btn btn-clean btn-sm" id="banksClear" type="button">
              Limpar
            </button>

          </div>


          <div class="btn-inline btn-position-right">

            <button class="btn btn-new btn-sm" id="banksNew" type="button">
              Novo Banco
            </button>

          </div>

        </form>

      </div>


      <!-- ================================================================
           TABLE
      ================================================================= -->

      <div class="table-scroll table-height-flex" data-table-settings="banks.bankstablebody">

        <table class="table table-zebra table-zebra-hover table-sticky-head">

          <thead>

            <tr>
              <th>ID</th>
              <th>Código</th>
              <th>Banco</th>
              <th>Status</th>
              <th>Ações</th>
            </tr>

          </thead>

          <tbody id="banksTableBody"></tbody>

        </table>

      </div>


      <!-- ================================================================
           FOOTER / PAGINATION
      ================================================================= -->

      <footer class="table-footer">

        <div class="table-footer__info">

          <div class="summary-pill summary-pill--success summary-width-4 summary-left-space-3">

            <span id="apTableInfo">
              0 Registros
            </span>

          </div>

        </div>


        <div class="table-footer__pagination">

          <button type="button" id="btnPreviousPage" class="btn btn-clean btn-sm">
            Anterior
          </button>

          <span id="apPageInfo">
            Página 1 de 1
          </span>

          <button type="button" id="btnNextPage" class="btn btn-new btn-sm">
            Próxima
          </button>

        </div>


        <div class="table-footer__page-size">

          <label for="apRowsPerPage">
            Mostrar
          </label>

          <select id="apRowsPerPage" class="table-footer__page-size-select" name="rowsPerPage">

            <option value="10">
              10 linhas
            </option>

            <option value="20">
              20 linhas
            </option>

            <option value="30">
              30 linhas
            </option>

            <option value="50" selected>
              50 linhas
            </option>

            <option value="100">
              100 linhas
            </option>

          </select>

        </div>

      </footer>

    </section>

  </main>


  <!-- ==================================================================
       MODAL — BANCO
  =================================================================== -->

  <div id="banksModal" class="modal" aria-hidden="true">

    <!-- BACKDROP -->

    <div class="modal__backdrop" data-modal-close></div>


    <!-- DIALOG POSITIONING CONTAINER -->

    <div class="modal__dialog">


      <!-- ACTUAL MODAL PANEL -->

      <section class="modal__panel modal-width-4 modal-height-3" role="dialog" aria-modal="true"
        aria-labelledby="banksModalTitle">


        <!-- ============================================================
             HEADER
        ============================================================= -->

        <header class="modal__header modal-header-color-3">

          <h3 id="banksModalTitle" class="modal__title">
            Novo Banco
          </h3>


          <button class="modal__close" type="button" data-modal-close aria-label="Fechar" title="Fechar">
            ×
          </button>

        </header>


        <!-- ============================================================
             BODY
        ============================================================= -->

        <div class="modal__body">

          <form id="banksForm">

            <input id="bankId" type="hidden">


            <!-- PRINCIPAL DATA -->

            <div class="modal-form-grid modal-form-grid--2">


              <!-- CODE -->

              <div class="fields fields-h-6">

                <label for="bankCode">
                  Código
                </label>

                <input id="bankCode" type="text" maxlength="10" placeholder="Ex.: 001" autocomplete="off">

              </div>


              <!-- NAME -->

              <div class="fields fields-h-6">

                <label for="bankName">
                  Nome
                </label>

                <input id="bankName" type="text" maxlength="150" autocomplete="off" required>

              </div>

            </div>


            <!-- STATUS -->

            <div class="modal-section">

              <label>

                <input id="bankActive" type="checkbox" checked>

                Banco ativo

              </label>

            </div>

          </form>

        </div>


        <!-- ============================================================
             FOOTER
        ============================================================= -->

        <footer class="modal__footer modal-footer-color-3">

          <button class="btn btn-cancel btn-sm" type="button" data-modal-close>
            Cancelar
          </button>


          <button class="btn btn-save btn-sm" type="submit" form="banksForm">
            Salvar
          </button>

        </footer>


      </section>

    </div>

  </div>


  <!-- ==================================================================
       SCRIPTS
  =================================================================== -->

  <script type="module" src="/public/includes/js/core.js"></script>

  <script type="module" src="./js/banks.init.js"></script>

</body>

</html>

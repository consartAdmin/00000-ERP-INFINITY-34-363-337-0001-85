<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Better Date To Buy</title>

  <link rel="icon" href="/public/imagens/brasaoConsartInfinity.png" />

  <link rel="stylesheet" href="/public/includes/css/style.css" />

  <link rel="stylesheet" href="./betterDateToBuy.css" />
</head>

<body>
  <main class="consart-container consart-container--fixed consart-container--full consart-container--h-800">
    <div class="consart-layout-col">

      <!-- HEADER -->
      <header class="page-header">

        <button id="btnRefresh" class="btn btn-toolbar btn-sm">
          Refresh
        </button>
      </header>

      <!-- CREATE ALERT -->
      <section class="card">
        <h2>Create Monthly Alert</h2>

        <form id="betterDateForm">

          <!-- CUSTOMER -->
          <div class="field-group">
            <label>Customer</label>

            <input type="hidden" id="customer_id" required />

            <div class="inline-search">
              <input type="text" id="customer_name" placeholder="Select customer..." readonly />

              <button type="submit" class="btn btn-toolbar btn-sm" id="btnSearchCustomer">
                Search
              </button>
            </div>
          </div>

          <!-- ALERT DAY -->
          <div class="field-group">
            <label>Alert Day (1–31)</label>

            <input type="number" id="alert_day" min="1" max="31" required placeholder="Ex: 15" />
          </div>

          <!-- NOTES -->
          <div class="field-group">
            <label>Notes</label>

            <input type="text" id="notes" placeholder="Optional notes" />
          </div>

          <!-- SAVE -->
          <div class="field-group action-field">
            <button type="submit" class="btn btn-toolbar btn-sm">
              Save Alert
            </button>
          </div>

        </form>
      </section>

      <!-- ALERTS TABLE -->
      <section class="card">
        <h2>Today's Alerts</h2>

        <div class="table-box consart-table-sticky excel-sheet">
          <table id="tblProducts" class="table table-zebra table-excel">
            <thead>
              <tr>
                <th>Customer</th>
                <th>Alert Day</th>
                <th>Status</th>
                <th>Notes</th>
                <th>Action</th>
              </tr>
            </thead>

            <tbody id="alertsTableBody"></tbody>
          </table>
        </div>
      </section>

  </main>

  <script type="module" src="./betterDateToBuy.js"></script>

  <script type="module" src="/public/includes/js/core.js"></script>

</body>

</html>

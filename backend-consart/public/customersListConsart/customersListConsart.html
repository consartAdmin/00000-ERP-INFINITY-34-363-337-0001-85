<!-- ╔══════════════════════════════════════════════════════════════════╗
     ║ 👥 customerList.html — Lista de Clientes | CONSART ERP         ║
     ║ Padrão visual: style.css + containerConsart.css                 ║
     ╚══════════════════════════════════════════════════════════════════╝ -->
<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- 🟦 Favicons CONSART -->
  <link rel="icon" type="image/png" sizes="16x16" href="/public/imagens/brasaoConsartInfinity.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/public/imagens/brasaoConsartInfinity.png">
  <link rel="icon" type="image/png" sizes="64x64" href="/public/imagens/brasaoConsartInfinity.png">
  <link rel="icon" href="/public/imagens/brasaoConsartInfinity.png">

  <title>CLIENTES | CONSART ERP</title>

  <!-- 🎨 Design System -->
  <link rel="stylesheet" href="/public/includes/css/style.css" />

  <!-- Cabeçalhos ordenáveis -->
  <link rel="stylesheet" href="/public/includes/css/sortableTable.css" />

  <!-- CSS do módulo -->
  <link rel="stylesheet" href="/public/customersList/customersList.css" />

  <!-- Enviar clientes marcados ao CRM Consart ERP -->
  <link rel="stylesheet" href="/public/customersListConsart/customersListConsart.crm.css" />
</head>

<body class="consart-theme p-page pw-page--full ph-page--xr">
  <main class="consart-container consart-container--full consart-container--ultraslim">

    <section class="table-layout-integrated table-max-height-700">
      <div class="table-layout-integrated__filter">
        <!-- 🌟 VISUAL do módulo (não controla altura/scroll) -->
        <!-- Filtros -->
        <div class="fields-inline fields-inline-scroll fields-gap-3">

          <!-- Buscar -->
          <div class="fields fields-h-5 fields-w-20 fields-font-3">
            <span class="label">Buscar</span>
            <input id="q" type="text" placeholder="Nome, CNPJ/CPF, e-mail..." />
          </div>

          <!-- Situação -->
          <div class="fields fields-h-5 fields-w-7 fields-font-3">
            <span class="label">Situação</span>
            <select id="status">
              <option value="">Todas</option>
              <option value="true">Ativos</option>
              <option value="false">Inativos</option>
            </select>
          </div>

          <!-- Status comercial -->
          <div class="fields fields-h-5 fields-w-10 fields-font-3">
            <span class="label">Status</span>
            <select id="statusType">
              <option value="">Todos</option>
            </select>
          </div>

          <!-- Segmento -->
          <div class="fields fields-h-5 fields-w-10 fields-font-3">
            <span class="label">Segmento</span>
            <select id="segmento">
              <option value="">Todos</option>
            </select>
          </div>

          <!-- Vendedor -->
          <div class="fields fields-h-5 fields-w-10 fields-font-3">
            <span class="label">Vendedor</span>
            <select id="vendedor">
              <option value="">Todos</option>
            </select>
          </div>

          <!-- Botões -->
          <div class="btn-inline btn-gap-4">

            <button id="btnSearch" class="btn btn-search btn-sm" type="button">
              Buscar
            </button>

            <button id="btnNew" class="btn btn-new btn-sm" type="button">
              ➕ Novo Cliente
            </button>

            <button id="btnReload" class="btn btn-load btn-sm" type="button">
              Recarregar
            </button>

            <button id="btnBack" class="btn btn-back btn-sm" type="button">
              Voltar
            </button>

            <!-- Clientes marcados na lista → cards no CRM Consart ERP -->
            <button id="btnSendCrm" class="btn btn-save btn-sm crm-send-button" type="button" disabled
              title="Marque os clientes na lista para enviar ao CRM">
              <span aria-hidden="true">📤</span>
              <span>Enviar ao CRM</span>
              <span id="crmSelectedCount" class="crm-send-button__count" hidden>0</span>
            </button>

          </div>

          <!-- Exportação (à direita) -->
          <div class="btn-inline btn-gap-4 btn-position-right">

            <button id="btnPdf" class="btn btn-toolbar btn-sm" type="button" title="Exportar PDF">
              <img src="/iconsImagens/pdf.png" alt="" width="20" height="20" aria-hidden="true" />
              <span>Exportar PDF</span>
            </button>

            <button id="btnExcel" class="btn btn-toolbar btn-sm" type="button" title="Exportar Excel">
              <img src="/iconsImagens/excelIcons.png" alt="" width="20" height="20" aria-hidden="true" />
              <span>Exportar Excel</span>
            </button>

          </div>
        </div>
      </div>

      <!-- ✅ Área rolável padrão CONSART -->
      <div class="table-scroll table-height-flex table-row-h-28" data-table-settings="customerslist.customerstable">
        <table id="customersTable" class="
      table
      table-fixed
      table-zebra
      table-zebra-hover
      table-sticky-head
      table-freeze-left-3
      table-freeze-right-1
    " style="
      --table-freeze-col-1-width: 42px;
      --table-freeze-col-2-width: var(--table-column-width-3);
      --table-freeze-col-3-width: var(--table-column-width-8);
    ">
          <thead>
            <tr>
              <th class="table-col-select col-select">
                <input id="crmSelectAll" type="checkbox" title="Selecionar todos desta página"
                  aria-label="Selecionar todos os clientes desta página" />
              </th>

              <th class="table-col-w-3 table-sortable" data-sort-column="customer_id" aria-sort="none">
                <button type="button" class="table-sort-button" data-sort-button>
                  ID
                  <span data-sort-icon aria-hidden="true">↕</span>
                </button>
              </th>

              <th class="table-col-w-8 table-sortable" data-sort-column="trade_name" aria-sort="none">
                <button type="button" class="table-sort-button" data-sort-button>
                  Nome Fantasia
                  <span data-sort-icon aria-hidden="true">↕</span>
                </button>
              </th>

              <th class="table-col-w-6 table-sortable" data-sort-column="tax_id" aria-sort="none">
                <button type="button" class="table-sort-button" data-sort-button>
                  CNPJ/CPF
                  <span data-sort-icon aria-hidden="true">↕</span>
                </button>
              </th>

              <th class="table-col-w-8 table-sortable" data-sort-column="email" aria-sort="none">
                <button type="button" class="table-sort-button" data-sort-button>
                  E-mail
                  <span data-sort-icon aria-hidden="true">↕</span>
                </button>
              </th>

              <th class="table-col-w-5 table-sortable" data-sort-column="phone_number" aria-sort="none">
                <button type="button" class="table-sort-button" data-sort-button>
                  Telefone
                  <span data-sort-icon aria-hidden="true">↕</span>
                </button>
              </th>

              <th class="table-col-w-4 table-sortable" data-sort-column="postal_code" aria-sort="none">
                <button type="button" class="table-sort-button" data-sort-button>
                  CEP
                  <span data-sort-icon aria-hidden="true">↕</span>
                </button>
              </th>

              <th class="table-col-w-6 table-sortable" data-sort-column="street_type" aria-sort="none">
                <button type="button" class="table-sort-button" data-sort-button>
                  Tipo Logradouro
                  <span data-sort-icon aria-hidden="true">↕</span>
                </button>
              </th>

              <th class="table-col-w-8 table-sortable" data-sort-column="street_name" aria-sort="none">
                <button type="button" class="table-sort-button" data-sort-button>
                  Nome Logradouro
                  <span data-sort-icon aria-hidden="true">↕</span>
                </button>
              </th>

              <th class="table-col-w-3 table-sortable" data-sort-column="street_number" aria-sort="none">
                <button type="button" class="table-sort-button" data-sort-button>
                  Número
                  <span data-sort-icon aria-hidden="true">↕</span>
                </button>
              </th>

              <th class="table-col-w-7 table-sortable" data-sort-column="address_complement" aria-sort="none">
                <button type="button" class="table-sort-button" data-sort-button>
                  Complemento
                  <span data-sort-icon aria-hidden="true">↕</span>
                </button>
              </th>

              <th class="table-col-w-6 table-sortable" data-sort-column="neighborhood" aria-sort="none">
                <button type="button" class="table-sort-button" data-sort-button>
                  Bairro
                  <span data-sort-icon aria-hidden="true">↕</span>
                </button>
              </th>

              <th class="table-col-w-6 table-sortable" data-sort-column="city" aria-sort="none">
                <button type="button" class="table-sort-button" data-sort-button>
                  Cidade
                  <span data-sort-icon aria-hidden="true">↕</span>
                </button>
              </th>

              <th class="table-col-w-2 table-sortable" data-sort-column="state" aria-sort="none">
                <button type="button" class="table-sort-button" data-sort-button>
                  UF
                  <span data-sort-icon aria-hidden="true">↕</span>
                </button>
              </th>

              <th class="table-col-w-6 table-sortable" data-sort-column="seller_name" aria-sort="none">
                <button type="button" class="table-sort-button" data-sort-button>
                  Vendedor
                  <span data-sort-icon aria-hidden="true">↕</span>
                </button>
              </th>

              <th class="table-col-w-6 table-sortable" data-sort-column="segment_name" aria-sort="none">
                <button type="button" class="table-sort-button" data-sort-button>
                  Segmento
                  <span data-sort-icon aria-hidden="true">↕</span>
                </button>
              </th>

              <th class="table-col-w-5 table-sortable" data-sort-column="status_name" aria-sort="none">
                <button type="button" class="table-sort-button" data-sort-button>
                  Status
                  <span data-sort-icon aria-hidden="true">↕</span>
                </button>
              </th>

              <th class="table-col-w-4 table-sortable" data-sort-column="is_active" aria-sort="none">
                <button type="button" class="table-sort-button" data-sort-button>
                  Situação
                  <span data-sort-icon aria-hidden="true">↕</span>
                </button>
              </th>

              <th class="table-col-w-2">
                Ações
              </th>
            </tr>
          </thead>

          <tbody id="tbody">
            <!-- Preenchido via JavaScript -->
          </tbody>
        </table>
      </div>


      <footer class="table-footer">

        <!-- Rodapé -->
        <div class="table-footer__info">
          <div class="summary-pill summary-pill--success summary-width-4 summary-left-space-3">
            <span id="apTableInfo"> 0 registros encontrados</span>
          </div>
        </div>

        <div class="table-footer__pagination">

          <button type="button" id="prevPage" class="btn btn-clean btn-sm">
            Anterior
          </button>

          <span id="pageInfo">Página 1 de 1</span>

          <button type="button" id="nextPage" class="btn btn-new btn-sm">
            Próxima
          </button>

        </div>

        <div class="table-footer__page-size">
          <label for="perPage">Mostrar</label>

          <select id="perPage" class="table-footer__page-size-select" name="perPage">
            <option value="10">10 linhas</option>
            <option value="20">20 linhas</option>
            <option value="30">30 linhas</option>
            <option value="50" selected>50 linhas</option>
            <option value="100">100 linhas</option>
          </select>
        </div>

      </footer>
    </section>
  </main>

  <!-- Modal Enviar ao CRM (padrão modals.css / modal.js) -->
  <div id="crmSendModal" class="modal" aria-hidden="true">
    <div class="modal__backdrop" data-modal-close></div>

    <div class="modal__dialog">
      <section class="modal__panel modal-width-4" role="dialog" aria-modal="true" aria-labelledby="crmSendTitle">
        <div class="modal__header modal-header-color-3">
          <h2 id="crmSendTitle" class="modal__title">Enviar ao CRM Consart ERP</h2>
          <button class="modal__close" type="button" data-modal-close aria-label="Fechar" title="Fechar">&times;</button>
        </div>

        <div class="modal__body">
          <div class="modal-section">
            <div class="crm-send-head">
              <div class="fields fields-w-full fields-h-6">
                <label for="crmSendStage">Coluna do CRM</label>
                <select id="crmSendStage">
                  <option value="">Triagem</option>
                </select>
              </div>
              <span id="crmSendCount" class="crm-send-head__count">0 clientes selecionados</span>
            </div>

            <ul id="crmSendList" class="crm-send-list"></ul>

            <p class="crm-send-hint">
              Cada cliente vira um card, com o vendedor e o status do cadastro.
              Quem já tem card aberto no CRM não é duplicado.
            </p>
          </div>
        </div>

        <footer class="modal__footer modal-footer-color-3">
          <div class="btn-inline btn-gap-3">
            <button id="crmSendClear" class="btn btn-clean btn-sm" type="button">Limpar seleção</button>
          </div>
          <div class="btn-inline btn-gap-3">
            <button class="btn btn-cancel btn-sm" type="button" data-modal-close>Cancelar</button>
            <button id="crmSendConfirm" class="btn btn-save btn-sm" type="button">📤 Enviar</button>
          </div>
        </footer>
      </section>
    </div>
  </div>

  <!-- ?company=CONSART → clientes da Consart ERP (tabela customersConsart) -->
  <!-- Página Consart ERP: usa a tabela customersConsart (header X-ERP-Company).
       Cópia de /public/customersList/customersList.html; alterações de layout devem ir nas duas. -->
  <script>window.ERP_COMPANY = 'CONSART';</script>
  <script src="/public/includes/js/erpCompany.js"></script>
  <script src="/config/apiBase.js"></script>
  <script type="module" src="/public/includes/js/core.js"></script>
  <script type="module" src="/public/customersList/js/customersList.init.js"></script>
  <script type="module" src="/public/customersListConsart/customersListConsart.crm.js"></script>
</body>

</html>

     ║ Path: backend/public/nfeInutilizarEvents/nfeInutilizarEvents.html          ║
     ║                                                                            ║
     ║ Padrão CONSART: só /public/includes/css/style.css (design system).         ║
     ║  - Lista: table-layout-integrated + sortableTable + table-footer           ║
     ║  - Ações: actionIcons.js · Avisos/confirmações: centerAlertModal.js        ║
     ║  - Nova inutilização / Detalhes: modals.css + modal.js                     ║
     ║ API: /api/nfes/inutilizar                                                  ║
     ╚════════════════════════════════════════════════════════════════════════════╝ -->
<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>INUTILIZAR NF-e | CONSART ERP</title>

  <link rel="icon" href="/public/imagens/brasaoConsartInfinity.png">

  <!-- Design system CONSART (importa modals, fields, summary, sortableTable, actionIcons...) -->
  <link rel="stylesheet" href="/public/includes/css/style.css">
</head>

<body class="consart-theme p-page pw-page--full ph-page--xr">
  <main class="consart-container consart-container--full consart-container--ultraslim">

    <section class="table-layout-integrated table-max-height-700">

      <!-- FILTROS + AÇÕES (div, não <header>: topGradientBar injeta o título) -->
      <div class="table-layout-integrated__filter">
        <div class="fields-inline fields-inline-wrap fields-gap-3">

          <div class="fields fields-h-6 fields-w-20 fields-font-3">
            <label for="busca">Buscar</label>
            <input id="busca" type="search" placeholder="Protocolo, mensagem, justificativa ou CNPJ..." autocomplete="off">
          </div>

          <div class="fields fields-h-6 fields-w-10 fields-font-3">
            <label for="filtroStatus">Status</label>
            <select id="filtroStatus">
              <option value="">Todos</option>
              <option value="done">Inutilizada</option>
              <option value="processing">Em processamento</option>
              <option value="pending">Pendente</option>
              <option value="error">Erro / Rejeitada</option>
            </select>
          </div>

          <div class="fields fields-h-6 fields-w-8 fields-font-3">
            <label for="filtroModelo">Modelo</label>
            <select id="filtroModelo">
              <option value="">Todos</option>
              <option value="55">55 - NF-e</option>
              <option value="65">65 - NFC-e</option>
            </select>
          </div>

          <div class="fields fields-h-6 fields-w-5 fields-font-3">
            <label for="filtroSerie">Série</label>
            <input id="filtroSerie" type="text" inputmode="numeric" maxlength="3" placeholder="Todas">
          </div>

          <div class="fields fields-h-6 fields-w-5 fields-font-3">
            <label for="filtroAno">Ano</label>
            <input id="filtroAno" type="text" inputmode="numeric" maxlength="4" placeholder="Todos">
          </div>

          <div class="fields fields-h-6 fields-w-8 fields-font-3">
            <label for="filtroNumero">Nº na faixa</label>
            <input id="filtroNumero" type="text" inputmode="numeric" maxlength="9" placeholder="Ex.: 8569">
          </div>

          <button id="btnBuscar" type="button" class="btn btn-filter btn-sm">Aplicar Filtros</button>
          <button id="btnLimparFiltros" type="button" class="btn btn-clean btn-sm">Limpar</button>

          <div class="btn-inline btn-gap-2 btn-position-right">
            <button id="btnNovo" type="button" class="btn btn-new btn-sm">+ Nova inutilização</button>
            <button id="btnRecarregar" type="button" class="btn btn-toolbar btn-sm" title="Recarregar">🔄 Recarregar</button>
          </div>
        </div>
      </div>

      <!-- LISTA -->
      <div class="table-scroll table-height-flex table-row-h-20" data-table-settings="nfeinutilizarevents.bodytable">
        <table id="inutilizacaoTable" class="table table-zebra table-zebra-hover table-sticky-head">
          <thead>
            <tr>
              <th class="table-col-w-2 table-sortable" data-sort-column="id" aria-sort="descending"><button type="button"
                  class="table-sort-button is-sorted" data-sort-button data-sort-direction="desc">ID <span data-sort-icon
                    aria-hidden="true">↓</span></button></th>
              <th class="table-col-w-5 table-sortable" data-sort-column="status" aria-sort="none"><button type="button"
                  class="table-sort-button" data-sort-button>Status <span data-sort-icon aria-hidden="true">↕</span></button></th>
              <th class="table-col-w-6 table-sortable" data-sort-column="companyCnpj" aria-sort="none"><button type="button"
                  class="table-sort-button" data-sort-button>CNPJ <span data-sort-icon aria-hidden="true">↕</span></button></th>
              <th class="table-col-w-4 table-sortable" data-sort-column="model" aria-sort="none"><button type="button"
                  class="table-sort-button" data-sort-button>Modelo / Série <span data-sort-icon aria-hidden="true">↕</span></button></th>
              <th class="table-col-w-5 table-sortable" data-sort-column="numberStart" aria-sort="none"><button type="button"
                  class="table-sort-button" data-sort-button>Faixa <span data-sort-icon aria-hidden="true">↕</span></button></th>
              <th class="table-col-w-2 table-sortable" data-sort-column="year" aria-sort="none"><button type="button"
                  class="table-sort-button" data-sort-button>Ano <span data-sort-icon aria-hidden="true">↕</span></button></th>
              <th class="table-sortable th-left" data-sort-column="message" aria-sort="none"><button type="button"
                  class="table-sort-button" data-sort-button>Retorno SEFAZ <span data-sort-icon aria-hidden="true">↕</span></button></th>
              <th class="table-col-w-6 table-sortable" data-sort-column="createdAt" aria-sort="none"><button type="button"
                  class="table-sort-button" data-sort-button>Criado em <span data-sort-icon aria-hidden="true">↕</span></button></th>
              <th class="table-col-w-4">Ações</th>
            </tr>
          </thead>
          <tbody id="bodyTable"></tbody>
        </table>
      </div>

      <!-- RODAPÉ PADRÃO -->
      <footer class="table-footer">
        <div class="table-footer__info">
          <div class="summary-pill summary-pill--success summary-width-5 summary-left-space-3">
            <span id="apTableInfo">0 registros encontrados</span>
          </div>

          <div class="summary summary--center summary-gap-8">
            <div class="summary-pill summary-pill--success" id="sumDone">0 inutilizadas</div>
            <div class="summary-pill summary-pill--warning" id="sumProcessing">0 em processamento</div>
            <div class="summary-pill summary-pill--danger" id="sumError">0 com erro</div>
          </div>
        </div>

        <div class="table-footer__pagination">
          <button type="button" id="btnPrev" class="btn btn-clean btn-sm">Anterior</button>
          <span id="paginacaoInfo">Página 1 de 1</span>
          <button type="button" id="btnNext" class="btn btn-new btn-sm">Próxima</button>
        </div>

        <div class="table-footer__page-size">
          <label for="pageSize">Mostrar</label>
          <select id="pageSize" class="table-footer__page-size-select" name="pageSize">
            <option value="10">10 linhas</option>
            <option value="20">20 linhas</option>
            <option value="50" selected>50 linhas</option>
            <option value="100">100 linhas</option>
          </select>
        </div>
      </footer>
    </section>
  </main>

  <!-- ╭──────────────────────────────────────────────╮
       │ MODAL — NOVA INUTILIZAÇÃO                     │
       ╰──────────────────────────────────────────────╯ -->
  <div class="modal modal-width-10 modal-header-color-3 modal-footer-color-3" id="novaInutilizacaoModal" role="dialog"
    aria-modal="true" aria-labelledby="novaTitulo" aria-hidden="true">
    <div class="modal__backdrop" data-modal-close="backdrop"></div>
    <div class="modal__dialog">
      <section class="modal__panel" role="document">
        <header class="modal__header">
          <h3 class="modal__title" id="novaTitulo">Nova inutilização de numeração</h3>
          <button type="button" class="modal__close" data-modal-close aria-label="Fechar">✕</button>
        </header>

        <form id="formInutilizacao" class="modal__body modal-section" autocomplete="off" novalidate>
          <div class="modal-form-grid modal-form-grid--6 fields-value-bold">

            <!-- EMPRESA E DOCUMENTO -->
            <div class="summary summary--between summary-gap-8 modal-field--span-full">
              <h4>Empresa e documento</h4>
            </div>

            <div class="fields fields-h-6 fields-w-full fields-font-3 modal-field--span-2">
              <label for="companyCnpj">CNPJ da empresa *</label>
              <input id="companyCnpj" type="text" inputmode="numeric" maxlength="18" placeholder="00.000.000/0000-00" required>
            </div>

            <div class="fields fields-h-6 fields-w-full fields-font-3 modal-field--span-2">
              <label for="model">Modelo *</label>
              <select id="model">
                <option value="55" selected>55 - NF-e</option>
                <option value="65">65 - NFC-e</option>
              </select>
            </div>

            <div class="fields fields-h-6 fields-w-full fields-font-3">
              <label for="serie">Série *</label>
              <input id="serie" type="text" inputmode="numeric" maxlength="3" placeholder="1" required>
            </div>

            <div class="fields fields-h-6 fields-w-full fields-font-3">
              <label for="year">Ano *</label>
              <input id="year" type="text" inputmode="numeric" maxlength="4" placeholder="2026" required>
            </div>

            <div class="modal-divider modal-divider--soft modal-field--span-full"></div>

            <!-- FAIXA -->
            <div class="summary summary--between summary-gap-8 modal-field--span-full">
              <h4>Faixa a inutilizar</h4>
              <div class="summary summary--inline summary-gap-8">
                <div class="summary-pill summary-pill--info" id="summaryRange">Faixa: —</div>
                <div class="summary-pill summary-pill--primary" id="summaryTotal">0 números</div>
              </div>
            </div>

            <div class="fields fields-h-6 fields-w-full fields-font-3 modal-field--span-2">
              <label for="numberStart">Número inicial *</label>
              <input id="numberStart" type="text" inputmode="numeric" maxlength="9" placeholder="Ex.: 8567" required>
            </div>

            <div class="fields fields-h-6 fields-w-full fields-font-3 modal-field--span-2">
              <label for="numberEnd">Número final *</label>
              <input id="numberEnd" type="text" inputmode="numeric" maxlength="9" placeholder="Ex.: 8569" required>
            </div>

            <div class="modal-divider modal-divider--soft modal-field--span-full"></div>

            <!-- JUSTIFICATIVA -->
            <div class="summary summary--between summary-gap-8 modal-field--span-full">
              <h4>Justificativa</h4>
              <div class="summary-pill summary-pill--warning" id="justificationCounter">0 / 255 · mínimo 15</div>
            </div>

            <div class="fields fields-w-full fields-font-3 modal-field--span-full">
              <label for="justification">Motivo enviado à SEFAZ *</label>
              <textarea id="justification" maxlength="255" required
                class="textarea textarea-border-1 textarea-radius-4 textarea-h-3 textarea-w-10 textarea-resize-vertical"
                placeholder="Ex.: Numeração pulada por falha na transmissão do sistema."></textarea>
            </div>
          </div>
        </form>

        <footer class="modal__footer">
          <button type="button" class="btn btn-clean btn-sm" data-modal-close>Cancelar</button>
          <button id="btnSubmit" type="submit" form="formInutilizacao" class="btn btn-new btn-sm">Enviar à SEFAZ</button>
        </footer>
      </section>
    </div>
  </div>

  <!-- ╭──────────────────────────────────────────────╮
       │ MODAL — DETALHES DA INUTILIZAÇÃO              │
       ╰──────────────────────────────────────────────╯ -->
  <div class="modal modal-width-10 modal-header-color-3 modal-footer-color-3" id="detalhesModal" role="dialog"
    aria-modal="true" aria-labelledby="detalhesTitulo" aria-hidden="true">
    <div class="modal__backdrop" data-modal-close="backdrop"></div>
    <div class="modal__dialog">
      <section class="modal__panel" role="document">
        <header class="modal__header">
          <h3 class="modal__title" id="detalhesTitulo">Inutilização</h3>
          <button type="button" class="modal__close" data-modal-close aria-label="Fechar">✕</button>
        </header>

        <div class="modal__body modal-section" id="detalhesBody"></div>

        <footer class="modal__footer">
          <button type="button" class="btn btn-clean btn-sm" data-modal-close>Fechar</button>
          <button id="btnDuplicarFaixa" type="button" class="btn btn-toolbar btn-sm">Usar como modelo</button>
          <button id="btnConsultar" type="button" class="btn btn-new btn-sm">Consultar na SEFAZ</button>
        </footer>
      </section>
    </div>
  </div>

  <script type="module" src="/public/nfeInutilizarEvents/js/nfeInutilizarEvents.init.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="icon" href="/public/imagens/brasaoConsartInfinity.png" />
  <title>DEPARTAMENTOS | CONSART ERP</title>

  <link rel="stylesheet" href="/public/includes/css/style.css" />
  <!-- mesmo visual da tela de Colaboradores (toolbar, pills, modal) -->
  <link rel="stylesheet" href="/public/employees/employees.css?v=esm-11" />
</head>

<body class="consart-theme page-employees p-page pw-page--full ph-page--xr">
  <main class="consart-container consart-container--full consart-container--ultraslim">

    <section class="table-layout-integrated table-max-height-700">
      <div class="table-layout-integrated__filter">
        <div class="emp-toolbar">
          <div class="emp-toolbar__title">
            <span class="emp-toolbar__icon" aria-hidden="true">🏢</span>
            <div>
              <h1>Departamentos</h1>
              <p>Departamentos usados no cadastro de colaboradores</p>
            </div>
          </div>

          <div class="fields-inline fields-inline-wrap fields-gap-3">
            <div class="fields fields-w-20 fields-h-6">
              <input type="search" id="catalogSearch" placeholder="Buscar por nome ou descrição..."
                autocomplete="off" aria-label="Buscar departamento" />
            </div>

            <label class="emp-toggle">
              <input type="checkbox" id="catalogShowInactive" />
              <span>Incluir inativos</span>
            </label>
          </div>

          <div class="btn-inline btn-gap-4 emp-toolbar__actions">
            <button id="btnReload" class="btn btn-load btn-sm" type="button">↻ Recarregar</button>
            <button id="btnNew" class="btn btn-new btn-sm" type="button">➕ Novo Departamento</button>
          </div>
        </div>
      </div>

      <div class="table-scroll table-scroll--flex table-row-h-20">
        <table id="catalogTable" class="table table-fixed table-zebra table-zebra-hover table-sticky-head" aria-label="Departamentos">
          <thead>
            <tr>
              <th class="emp-col-id">ID</th>
              <th class="cat-col-name">Nome</th>
              <th class="cat-col-desc">Descrição</th>
              <th class="cat-col-count">Colaboradores</th>
              <th class="emp-col-status">Status</th>
              <th class="cat-col-actions">Ações</th>
            </tr>
          </thead>
          <tbody id="catalogBody"></tbody>
        </table>
      </div>

      <footer class="table-footer">
        <div class="table-footer__info">
          <div class="summary-pill summary-pill--success summary-width-4 summary-left-space-3">
            <span id="catalogInfo">Carregando...</span>
          </div>
        </div>
      </footer>
    </section>
  </main>

  <!-- Modal Departamento (padrão modals.css / modal.js) -->
  <div id="catalogModal" class="modal emp-modal" aria-hidden="true">
    <div class="modal__backdrop" data-modal-close></div>

    <div class="modal__dialog">
      <section class="modal__panel modal-width-5" role="dialog" aria-modal="true" aria-labelledby="catalogModalTitle">

        <!-- div (e não <header>): a barra de título global (topGradientBar) se ancora no 1º <header> da página -->
        <div class="modal__header modal-header-color-3">
          <h2 id="catalogModalTitle" class="modal__title">Novo departamento</h2>
          <button class="modal__close" type="button" data-modal-close aria-label="Fechar" title="Fechar">&times;</button>
        </div>

        <div class="modal__body">
          <form id="catalogForm" class="emp-section" autocomplete="off" novalidate>
            <input type="hidden" id="cf-id" />
            <div class="emp-section__grid">
              <div class="fields fields-h-6 fields-font-3">
                <label for="cf-name">Nome *</label>
                <input type="text" id="cf-name" maxlength="100" placeholder="Ex.: Comercial" required />
              </div>

              <div class="fields fields-h-6 fields-font-3">
                <label for="cf-active">Status</label>
                <select id="cf-active">
                  <option value="true">Ativo</option>
                  <option value="false">Inativo</option>
                </select>
              </div>

              <div class="fields fields-font-3 emp-span-full">
                <label for="cf-description">Descrição</label>
                <textarea id="cf-description" rows="3" placeholder="Opcional"></textarea>
              </div>
            </div>
          </form>
        </div>

        <div class="modal__footer">
          <button type="button" class="btn btn-cancel btn-sm" data-modal-close>Cancelar</button>
          <button type="submit" id="btnSave" class="btn btn-save btn-sm" form="catalogForm">💾 Salvar</button>
        </div>
      </section>
    </div>
  </div>

  <script type="module" src="/public/includes/js/core.js"></script>
  <script type="module" src="/public/employeesDepartments/js/employeesDepartments.js?v=1"></script>
</body>

</html>

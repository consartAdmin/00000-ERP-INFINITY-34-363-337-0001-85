<!-- ╔══════════════════════════════════════════════════════════════════╗
     ║ servicesConsart.html — Cadastro de serviços (CONSART ERP)        ║
     ║ Lista + editor (modal). Os serviços aparecem no modal            ║
     ║ "Buscar Serviço" das Propostas de Serviços.                      ║
     ║ API: /api/services-consart                                       ║
     ╚══════════════════════════════════════════════════════════════════╝ -->
<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <title>SERVIÇOS | CONSART ERP</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="icon" href="/public/imagens/brasaoConsartInfinity.png">

  <link rel="stylesheet" href="/public/includes/css/style.css" />
  <link rel="stylesheet" href="/public/servicesConsart/servicesConsart.css?v=1" />
</head>

<body class="consart-theme p-page pw-page--full ph-page--xr">
  <main class="consart-container consart-container--full consart-container--ultraslim">

    <section class="table-layout-integrated table-max-height-700">
      <div class="table-layout-integrated__filter">
        <div class="fields-inline fields-inline-scroll fields-gap-3">

          <div class="fields fields-h-5 fields-w-20 fields-font-3">
            <span class="label">Buscar</span>
            <input id="q" type="text" placeholder="Código, descrição, cód. serviço..." />
          </div>

          <div class="fields fields-h-5 fields-w-8 fields-font-3">
            <span class="label">Status</span>
            <select id="filterActive">
              <option value="true">Ativos</option>
              <option value="false">Inativos</option>
              <option value="">Todos</option>
            </select>
          </div>

          <div class="fields fields-h-5 fields-w-10 fields-font-3">
            <span class="label">Categoria</span>
            <select id="filterCategory">
              <option value="">Todas</option>
            </select>
          </div>

          <div class="btn-inline btn-gap-4">
            <button id="btnSearch" class="btn btn-search btn-sm" type="button">Buscar</button>
            <button id="btnNew" class="btn btn-new btn-sm" type="button">➕ Novo Serviço</button>
            <button id="btnReload" class="btn btn-load btn-sm" type="button">Recarregar</button>
            <button id="btnBack" class="btn btn-back btn-sm" type="button">Voltar</button>
          </div>
        </div>
      </div>

      <div class="table-scroll table-height-flex table-row-h-28">
        <table class="table table-fixed table-zebra table-zebra-hover table-sticky-head services-table">
          <thead>
            <tr>
              <th class="services-col-code">Código</th>
              <th class="services-col-left">Descrição</th>
              <th class="services-col-unit">Un.</th>
              <th class="services-col-lc">Cód. serviço</th>
              <th class="services-col-category">Categoria</th>
              <th class="services-col-money">Preço (R$)</th>
              <th class="services-col-status">Status</th>
              <th class="services-col-actions">Ações</th>
            </tr>
          </thead>
          <tbody id="servicesBody"></tbody>
        </table>
        <div id="servicesEmpty" class="services-empty" hidden>Nenhum serviço encontrado com os filtros atuais.</div>
      </div>

      <footer class="table-footer">
        <div class="table-footer__info">
          <div class="summary-pill summary-pill-success summary-left-space-3">
            <span id="servicesInfo">0 serviços</span>
          </div>
        </div>

        <div class="table-footer__pagination">
          <button id="btnPrevious" type="button" class="btn btn-toolbar btn-sm">Anterior</button>
          <span id="pageInfo">Página 1 de 1</span>
          <button id="btnNext" type="button" class="btn btn-toolbar btn-sm">Próxima</button>
        </div>

        <div class="table-footer__page-size">
          <label for="pageSize">Mostrar</label>
          <div class="fields fields-h-6 fields-w-3 fields-font-3">
            <select id="pageSize" class="table-footer__page-size-select">
              <option value="20">20</option>
              <option value="50" selected>50</option>
              <option value="100">100</option>
            </select>
          </div>
        </div>
      </footer>
    </section>
  </main>

  <!-- Modal Serviço (padrão modals.css / modal.js) -->
  <div id="service-modal" class="modal service-modal" aria-hidden="true">
    <div class="modal__backdrop" data-modal-close></div>

    <div class="modal__dialog">
      <section class="modal__panel modal-width-6" role="dialog" aria-modal="true" aria-labelledby="serviceModalTitle">

        <header class="modal__header modal-header-color-3">
          <h2 id="serviceModalTitle" class="modal__title">Novo Serviço</h2>
          <button class="modal__close" type="button" data-modal-close aria-label="Fechar" title="Fechar">&times;</button>
        </header>

        <div class="modal__body">
          <form id="service-form" class="modal-section" novalidate>
            <div class="modal-form-grid modal-form-grid--4">
              <div class="fields fields-w-full fields-h-6">
                <label for="sf-code">Código</label>
                <input type="text" id="sf-code" maxlength="30" placeholder="Automático (S0001...)">
              </div>
              <div class="fields fields-w-full fields-h-6 modal-field--span-3">
                <label for="sf-description">Descrição *</label>
                <input type="text" id="sf-description" maxlength="500" placeholder="Ex.: Hora técnica de implantação">
              </div>

              <div class="fields fields-w-full fields-h-6">
                <label for="sf-unit">Unidade</label>
                <input type="text" id="sf-unit" maxlength="10" list="sf-units" value="SV">
                <datalist id="sf-units">
                  <option value="SV">Serviço</option>
                  <option value="H">Hora</option>
                  <option value="MES">Mês</option>
                  <option value="DIA">Dia</option>
                  <option value="VB">Verba</option>
                  <option value="M2">Metro quadrado</option>
                  <option value="UN">Unidade</option>
                </datalist>
              </div>
              <div class="fields fields-w-full fields-h-6">
                <label for="sf-price">Preço (R$)</label>
                <input type="text" id="sf-price" inputmode="decimal" placeholder="0,00">
              </div>
              <div class="fields fields-w-full fields-h-6">
                <label for="sf-service-code">Cód. serviço (LC 116)</label>
                <input type="text" id="sf-service-code" maxlength="20" placeholder="Ex.: 1.07">
              </div>
              <div class="fields fields-w-full fields-h-6">
                <label for="sf-active">Status</label>
                <select id="sf-active">
                  <option value="true">Ativo</option>
                  <option value="false">Inativo</option>
                </select>
              </div>

              <div class="fields fields-w-full fields-h-6 modal-field--span-4">
                <label for="sf-category">Categoria</label>
                <input type="text" id="sf-category" maxlength="100" list="sf-categories" placeholder="Ex.: Manutenção, Consultoria, Treinamento">
                <datalist id="sf-categories"></datalist>
              </div>
            </div>

            <div class="fields fields-w-full services-details">
              <label for="sf-details">Detalhes (aparece na busca)</label>
              <textarea id="sf-details" rows="3" placeholder="O que está incluso, limites, observações..."></textarea>
            </div>
          </form>
        </div>

        <footer class="modal__footer modal-footer-color-3">
          <div class="btn-inline btn-gap-3">
            <button class="btn btn-cancel btn-sm" type="button" data-modal-close>Cancelar</button>
            <button id="sf-save" class="btn btn-save btn-sm" type="button">Salvar Serviço</button>
          </div>
        </footer>
      </section>
    </div>
  </div>

  <script>window.ERP_COMPANY = 'CONSART';</script>
  <script src="/public/includes/js/erpCompany.js"></script>
  <script type="module" src="/public/includes/js/core.js"></script>
  <script type="module" src="/public/servicesConsart/servicesConsart.js?v=1"></script>
</body>

</html>

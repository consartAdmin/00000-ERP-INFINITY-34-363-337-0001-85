<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NOTAS FISCAIS SISTEMA ANTIGO | CONSART ERP</title>

  <link rel="icon" href="/public/imagens/brasaoConsartInfinity.png">
  <link rel="stylesheet" href="/public/includes/css/style.css" />
</head>

<body class="consart-theme p-page pw-page--full ph-page--xr">
  <main class="consart-container consart-container--full consart-container--ultraslim">

    <section class="table-layout-integrated table-max-height-700">

      <!-- FILTROS (div, não <header>: topGradientBar injeta o título) -->
      <div class="table-layout-integrated__filter">
        <div class="fields-inline fields-inline-wrap fields-gap-3">

          <div class="fields fields-h-6 fields-w-20 fields-font-3">
            <label for="fQ">Buscar</label>
            <input id="fQ" type="search" placeholder="Cliente, CNPJ/CPF, nº da NF, valor ou chave..." autocomplete="off" />
          </div>

          <div class="fields fields-h-6 fields-w-10 fields-font-3">
            <label for="fCampo">Buscar em</label>
            <select id="fCampo">
              <option value="all">Todos os campos</option>
              <option value="cliente">Cliente</option>
              <option value="cnpj">CNPJ/CPF</option>
              <option value="numero">Nº da NF</option>
              <option value="valor">Valor</option>
              <option value="arquivo">Chave / arquivo</option>
            </select>
          </div>

          <div class="fields fields-h-6 fields-w-8 fields-font-3">
            <label for="fDe">Emissão de</label>
            <input id="fDe" type="date" />
          </div>

          <div class="fields fields-h-6 fields-w-8 fields-font-3">
            <label for="fAte">Emissão até</label>
            <input id="fAte" type="date" />
          </div>

          <button id="btnSearch" type="button" class="btn btn-filter btn-sm"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18l-7 8v6l-4 2v-8L3 5Z"/></svg><span>Aplicar Filtros</span></button>
          <button id="btnClear" type="button" class="btn btn-clean btn-sm"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 21-4-4L14 6l6 6-9 9Z"/><path d="M11 21h10"/></svg><span>Limpar</span></button>

          <!-- Resumo do filtro atual -->
          <div class="summary-inline btn-inline btn-gap-2 btn-position-right">
            <span class="summary-pill summary-pill--info"><span id="sumCount">0 notas</span></span>
            <span class="summary-pill summary-pill--success">Total&nbsp;<span id="sumTotal">R$ 0,00</span></span>
          </div>
        </div>
      </div>

      <!-- LISTA -->
      <div class="table-scroll table-height-flex table-row-h-20" data-table-settings="painelnotasfiscais.tbody">
        <table id="nfTable" class="table table-zebra table-zebra-hover table-sticky-head">
          <thead>
            <tr>
              <th class="table-col-w-3 table-sortable" data-sort-column="numero" aria-sort="none"><button type="button" class="table-sort-button" data-sort-button>Nº NF <span data-sort-icon aria-hidden="true">↕</span></button></th>
              <th class="table-col-w-5 table-sortable" data-sort-column="emissao" aria-sort="descending"><button type="button" class="table-sort-button is-sorted" data-sort-button data-sort-direction="desc">Emissão <span data-sort-icon aria-hidden="true">↓</span></button></th>
              <th class="table-col-w-10 table-sortable th-left" data-sort-column="cliente" aria-sort="none"><button type="button" class="table-sort-button" data-sort-button>Cliente (Destinatário) <span data-sort-icon aria-hidden="true">↕</span></button></th>
              <th class="table-col-w-7 table-sortable" data-sort-column="cnpj" aria-sort="none"><button type="button" class="table-sort-button" data-sort-button>CNPJ/CPF <span data-sort-icon aria-hidden="true">↕</span></button></th>
              <th class="table-col-w-4 table-sortable th-right" data-sort-column="valor" aria-sort="none"><button type="button" class="table-sort-button" data-sort-button>Valor <span data-sort-icon aria-hidden="true">↕</span></button></th>
              <th class="th-left table-sortable" data-sort-column="nome" aria-sort="none"><button type="button" class="table-sort-button" data-sort-button>Arquivo XML <span data-sort-icon aria-hidden="true">↕</span></button></th>
              <th class="table-col-w-4">Ações</th>
            </tr>
          </thead>
          <tbody id="tbody">
            <tr><td colspan="7" class="td-center">Carregando...</td></tr>
          </tbody>
        </table>
      </div>

      <!-- RODAPÉ PADRÃO -->
      <footer class="table-footer">
        <div class="table-footer__info">
          <div class="summary-pill summary-pill--success summary-width-4 summary-left-space-3">
            <span id="tableInfo">Carregando...</span>
          </div>
        </div>

        <div class="table-footer__pagination">
          <button type="button" id="prevPage" class="btn btn-clean btn-sm">Anterior</button>
          <span id="pageInfo">Página 1 de 1</span>
          <button type="button" id="nextPage" class="btn btn-new btn-sm">Próxima</button>
        </div>

        <div class="table-footer__page-size">
          <label for="perPage">Mostrar</label>
          <select id="perPage" class="table-footer__page-size-select" name="perPage">
            <option value="20">20 linhas</option>
            <option value="50" selected>50 linhas</option>
            <option value="100">100 linhas</option>
            <option value="200">200 linhas</option>
          </select>
        </div>
      </footer>
    </section>
  </main>

  <script type="module" src="/public/includes/js/core.js"></script>
  <script type="module" src="/public/painelNotasFiscais/painelNotasFiscais.js?v=2"></script>
</body>

</html>

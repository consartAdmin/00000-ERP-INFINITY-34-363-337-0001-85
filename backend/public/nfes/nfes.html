<!-- /backend/public/nfes/nfes.html -->
<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />

  <!-- 🟦 Favicons CONSART -->
  <link rel="icon" type="image/png" sizes="16x16" href="/public/imagens/brasaoConsartInfinity.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/public/imagens/brasaoConsartInfinity.png">
  <link rel="icon" type="image/png" sizes="64x64" href="/public/imagens/brasaoConsartInfinity.png">
  <link rel="icon" href="/public/imagens/brasaoConsartInfinity.png">

  <title>NOTAS FISCAIS | CONSART ERP</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- 🎨 Design System CONSART -->
  <link rel="stylesheet" href="/public/includes/css/style.css" />

</head>

<!-- Conteúdo da página -->

<body class="consart-theme p-page pw-page--full ph-page--xr">
  <main class="consart-container consart-container--full consart-container--ultraslim">


    <section class="table-layout-integrated table-max-height-600">
      <!-- Container for all vertical lines -->
      <div class="table-layout-integrated__filter">

        <!-- Line 1: fields side by side -->
        <div class="fields-inline fields-gap-3">

          <div class="fields fields-h-5 fields-w-20 fields-font-3"> <span>Buscar</span>
            <input id="qNfes" type="text" placeholder="cliente, doc, pedido, chave" />
          </div>

          <date-range-field class="fields-h-6 fields-w-5" label="Vencimento" name-start="dueDateFrom"
            name-end="dueDateTo" locale="pt-BR" required>
          </date-range-field>

          <div class="fields fields-h-5 fields-w-10 fields-font-3"> <span>Buscar</span>
            <span>Status</span>
            <select id="statusNfe">
              <option value="">Todos</option>
              <option value="PROCESSANDO">PROCESSANDO</option>
              <option value="CONCLUIDO">CONCLUIDO</option>
              <option value="CANCELADO">CANCELADO</option>
              <option value="REJEITADA">REJEITADA</option>
            </select>
          </div>

          <div class="fields fields-h-5 fields-w-10 fields-font-3"> <span>Buscar</span>
            <span>Ordenar</span>
            <select id="sortByNfes">
              <option value="pedido" selected>Pedido</option>
              <option value="emissao">Emissão</option>
              <option value="numero_nfe">Nº NF-e</option>
              <option value="chave">Chave</option>
              <option value="cliente">Cliente</option>
              <option value="documento">CNPJ/CPF</option>
              <option value="total">Total</option>
              <option value="status">Status</option>
              <option value="ambiente">Ambiente</option>
            </select>
          </div>

          <div class="fields fields-h-5 fields-w-8 fields-font-3"> <span>Buscar</span>
            <span>Ordem</span>
            <select id="sortOrderNfes">
              <option value="desc" selected>Decr.</option>
              <option value="asc">Cresc.</option>
            </select>
          </div>

          <!-- 🔹 LINHA 2: BOTÕES -->
          <div class="btn-inline btn-position-right">

            <button id="btnBuscarNfes" class="btn btn-primary btn-sm">
              🔍 Buscar
            </button>

            <button id="btnExportarRelatorioNfes" class="btn btn-toolbar btn-sm">
              📊 Relat. Excel
            </button>

            <button id="btnDownloadXmlLote" class="btn btn-flat btn-sm">
              📦 Baixar XML
            </button>

            <button id="btnRecarregarNfes" class="btn btn-flat btn-sm">
              ⟳ Recarregar
            </button>

          </div>
        </div>
      </div>

      <!-- 📄 Tabela -->
      <div class="table-scroll table-height-flex table-row-h-20">
        <table class="table table-zebra table-zebra-hover table-sticky-head">
          <thead>
            <tr>
              <th class="ta-center" aria-label="Expandir detalhes"></th>

              <th class="sortable-th" data-sort="pedido" title="Ordenar Pedido">
                <span class="sort-wrap">Pedido <span class="sort-indicator"></span></span>
              </th>

              <th class="sortable-th" data-sort="emissao" title="Ordenar Emissão">
                <span class="sort-wrap">Emissão <span class="sort-indicator"></span></span>
              </th>

              <th class="sortable-th" data-sort="numero_nfe" title="Ordenar Nº NF-e">
                <span class="sort-wrap">Nº NF-e <span class="sort-indicator"></span></span>
              </th>

              <th class="sortable-th" data-sort="chave" title="Ordenar Chave de Acesso">
                <span class="sort-wrap">Chave de Acesso <span class="sort-indicator"></span></span>
              </th>

              <th class="sortable-th" data-sort="cliente" title="Ordenar por Cliente">
                <span class="sort-wrap">Cliente <span class="sort-indicator"></span></span>
              </th>

              <th class="sortable-th" data-sort="documento" title="Ordenar por CNPJ/CPF">
                <span class="sort-wrap">CNPJ/CPF <span class="sort-indicator"></span></span>
              </th>

              <th class="ta-right sortable-th" data-sort="total" title="Ordenar por Total">
                <span class="sort-wrap">Total (R$) <span class="sort-indicator"></span></span>
              </th>

              <th class="sortable-th" data-sort="status" title="Ordenar por Status NF-e">
                <span class="sort-wrap">Status NF-e <span class="sort-indicator"></span></span>
              </th>

              <th class="sortable-th" data-sort="ambiente" title="Ordenar por Ambiente">
                <span class="sort-wrap">Ambiente <span class="sort-indicator"></span></span>
              </th>

              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="corpoTabelaMovimentacoes"></tbody>
        </table>

        <div id="emptyNfes" class="mt-2" style="display:none;color:#64748b;">
          Nenhuma NF-e encontrada.
        </div>
      </div>

      <footer class="table-footer">

        <div class="table-footer__info">
          <div class="summary-pill summary-pill--success summary-width-4 summary-left-space-3">
            <span id="apTableInfo">0 registros encontrados</span>
          </div>
        </div>

        <div class="table-footer__pagination">

          <button type="button" id="pagAnterior" class="btn btn-clean btn-sm">
            Anterior
          </button>

          <span id="infoPagina">Página 1 de 1</span>

          <button type="button" id="pagProxima" class="btn btn-new btn-sm">
            Próxima
          </button>

        </div>

        <div class="table-footer__page-size">
          <label for="apRowsPerPage">Mostrar</label>

          <select id="apRowsPerPage" class="table-footer__page-size-select" name="rowsPerPage">
            <option value="10">10 linhas</option>
            <option value="20" selected>20 linhas</option>
            <option value="30">30 linhas</option>
            <option value="50">50 linhas</option>
            <option value="100">100 linhas</option>
          </select>
        </div>

      </footer>
    </section>

    </div>
  </main>

  <script>window.API_BASE = window.apiBase || window.location.origin;</script>
  <script type="module" src="/public/includes/js/core.js"></script>
  <script type="module" src="/public/nfes/js/nfes.js?v=20251212-2"></script>
</body>

</html>

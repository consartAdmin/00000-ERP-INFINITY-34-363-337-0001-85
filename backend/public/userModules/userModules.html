     ║ userModules.html — Gestão de Permissões por Usuário (CONSART ERP)   ║
     ╚══════════════════════════════════════════════════════════════════════╝ -->
<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Permissões de Módulos - CONSART ERP</title>

  <!-- 🟦 Favicons CONSART -->
  <link rel="icon" type="image/png" sizes="16x16" href="/public/imagens/brasaoConsartInfinity.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/public/imagens/brasaoConsartInfinity.png">
  <link rel="icon" type="image/png" sizes="64x64" href="/public/imagens/brasaoConsartInfinity.png">
  <link rel="icon" href="/public/imagens/brasaoConsartInfinity.png">

  <!-- Estilos globais -->
  <link rel="stylesheet" href="/public/includes/css/style.css" />
  <!-- Estilo específico da página -->
  <link rel="stylesheet" href="/public/userModules/userModules.css" />
</head>

<body class="consart-theme p-page pw-page--full ph-page--xr">
  <main class="consart-container consart-container--full consart-container--ultraslim consart-container--fixed user-modules-shell">

    <section class="table-layout-integrated">
      <div class="table-layout-integrated__filter">

        <div class="consart-layout-col">

          <!-- Tudo dentro do mesmo card -->
          <section class="section-card filtros-permissoes stack">

            <!-- Cabeçalho dentro do card -->
            <header class="page-header row between center filtros-header">
              <div class="stack">
                <h1>🔐 Permissões de Módulos por Usuário</h1>
                <p class="page-subtitle">
                </p>
              </div>

              <button id="btnRecarregar" class="btn btn-toolbar btn-sm">
                ⟳ Recarregar
              </button>
            </header>

            <!-- Filtros / seleção de usuário -->
            <div class="row center gap linha-filtros">
              <div class="campo">
                <label for="selectUsuario">Usuário</label>
                <select id="selectUsuario">
                  <option value="">Carregando usuários...</option>
                </select>
              </div>

              <div class="campo campo-busca">
                <label for="searchModulo">Buscar módulo</label>
                <input type="text" id="searchModulo" placeholder="Digite parte do nome do módulo..." />
              </div>
            </div>

            <!-- Barra de ferramentas / resumo -->
            <div class="user-modules-toolbar row between center">
              <div class="toolbar-left">
                <span id="counterSelected" class="pill-counter">0 selecionados</span>
                <span id="counterTotal" class="pill-counter pill-counter--muted">
                  de 0 módulos
                </span>
              </div>

              <div class="toolbar-right row gap-sm wrap">
                <label class="checkbox-chip">
                  <input type="checkbox" id="toggleSomenteMarcados" />
                  <span>Mostrar apenas módulos permitidos</span>
                </label>

                <button type="button" id="btnMarcarTodos" class="btn btn-toolbar btn-sm">
                  ✔ Marcar visíveis
                </button>

                <button type="button" id="btnLimparTodos" class="btn btn-toolbar btn-sm">
                  ☐ Limpar visíveis
                </button>
              </div>
            </div>

            <!-- Form / lista de módulos -->
            <form id="permissoesForm" class="stack">
              <div id="modulosContainer" class="modulos-container hidden">
                <div class="modulos-header row between center">
                  <h2>Módulos do Sistema</h2>
                  <button id="btnSalvar" type="submit" class="btn btn-toolbar btn-sm">
                    💾 Salvar Permissões
                  </button>
                </div>

                <div id="listaModulos" class="lista-modulos">
                  <!-- itens de módulos serão renderizados aqui via JS -->
                </div>
              </div>

              <p id="msgSelecioneUsuario" class="msg-ajuda">
                Selecione um usuário para visualizar e editar as permissões.
              </p>
            </form>
          </section>
        </div>
      </div>
    </section>
  </main>

  <!-- Scripts globais -->
  <script type="module" src="/public/includes/js/core.js"></script>
  <!-- Script específico -->

  <script type="module" src="/public/userModules/js/userModules.init.js"></script>

</body>

</html>

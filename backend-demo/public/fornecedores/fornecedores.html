<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro de Fornecedores</title>
  <!-- Tema / globais -->
  <link rel="stylesheet" href="/public/includes/theme-consart.css" />
  <link rel="stylesheet" href="/public/includes/menu.css" />
  <link rel="stylesheet" href="/public/includes/home.css">
  <link rel="stylesheet" href="/public/statusUsuario/statusUsuario.css" />

  <link rel="stylesheet" href="fornecedores.css" />
</head>
  <body class="consart-theme c-page">
    <main class="c-main">
      <div class="c-container c-container--2xl">
      <h1>Cadastro de Fornecedores</h1>

      <form id="formFornecedor" autocomplete="off">

        <!-- 🔒 Campo oculto para armazenar o ID -->
        <input type="hidden" id="id" name="id" />

        <!-- 🟦 Bloco: Informações do Fornecedor -->
         <input type="hidden" id="id" name="id" />
        <fieldset class="bloco">
          <legend>📦 Informações do Fornecedor</legend>
          <div class="form-grid">
            <div>
              <label for="nome">Nome*</label>
              <input type="text" id="nome" name="nome" required />
            </div>
            <div>
              <label for="cnpj_cpf">CNPJ/CPF</label>
              <input type="text" id="cnpj_cpf" name="cnpj_cpf" />
            </div>
            <div>
              <label for="ie">Inscrição Estadual</label>
              <input type="text" id="ie" name="ie" />
            </div>
            <div>
              <label for="telefone">Telefone</label>
              <input type="text" id="telefone" name="telefone" />
            </div>
            <div>
              <label for="email">Email</label>
              <input type="email" id="email" name="email" />
            </div>
            <div>
              <label for="vendedor">Vendedor</label>
              <input type="text" id="vendedor" name="vendedor" />
            </div>
            <div>
              <label for="email_vendedor">Email do Vendedor</label>
              <input type="email" id="email_vendedor" name="email_vendedor" />
            </div>
            <div>
              <label for="email_financeiro">Email Financeiro</label>
              <input type="email" id="email_financeiro" name="email_financeiro" />
            </div>
          </div>
        </fieldset>

        <!-- 🟩 Bloco: Endereço -->
        <fieldset class="bloco">
          <legend>🏠 Endereço</legend>
          <div class="form-grid">
            <div>
              <label for="endereco">Endereço</label>
              <textarea id="endereco" name="endereco" rows="2"></textarea>
            </div>
            <div>
              <label for="cidade">Cidade</label>
              <input type="text" id="cidade" name="cidade" />
            </div>
            <div>
              <label for="uf">UF</label>
              <select id="uf" name="uf">
                <option value="">--</option>
                <option value="MG">MG</option>
                <option value="SP">SP</option>
                <option value="RJ">RJ</option>
                <option value="ES">ES</option>
                <!-- outros estados -->
              </select>
            </div>
            <div>
              <label for="cep">CEP</label>
              <input type="text" id="cep" name="cep" />
            </div>
          </div>
        </fieldset>

        <!-- 🔘 Botões -->
        <div class="botoes-form">
          <button type="submit" id="btnSalvar">Salvar</button>
          <button type="button" id="btnNovoFornecedor">Novo</button>
        </div>
      </form>
    </div>

    <!-- 📋 Tabela -->
    <h2>Fornecedores Cadastrados</h2>
    <input type="text" id="filtroFornecedor" placeholder="Buscar por nome ou CNPJ" />

    <table>
      <thead>
        <tr>
          <th>Nome</th>
          <th>CNPJ/CPF</th>
          <th>Telefone</th>
          <th>Email</th>
          <th>UF</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="fornecedores">
        <!-- dados dinamicamente carregados -->
      </tbody>
    </table>

  </div>

  <!-- Script de Liberação de Módulos -->
  <script src="/public/includes/SecurityModules.js" defer></script>
 
  <script src="/public/verificarLogin/verificarLogin.js"></script>
  <script src="/public/statusUsuario/statusUsuario.js" defer></script>
  
  <script src="/public/includes/menu.js"></script>
  <script src="/public/includes/sessionTimeout.js" defer></script>

  <script src="/public/config/apiBase.js"></script>
  <script src="fornecedores.js"></script>

</body>
</html>

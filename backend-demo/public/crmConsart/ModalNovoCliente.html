<div class="modal-content">
  <h2>📋 Novo Cliente</h2>

  <form id="formCliente">
    <div class="form-modal-container">

      <!-- 🧱 Bloco 1: Dados Básicos -->
      <fieldset class="form-bloco">
        <legend>📄 Dados Básicos</legend>
        <div class="form-linha">
          <div class="form-grupo">
            <label>Próximo ID</label>
            <input type="text" id="proximo_id" disabled />
          </div>
          <div class="form-grupo">
            <label>Nome Fantasia</label>
            <input type="text" id="nome_fantasia" />
          </div>
        </div>

        <div class="form-linha">
          <div class="form-grupo">
            <label>Razão Social</label>
            <input type="text" id="razao_social" />
          </div>
          <div class="form-grupo" style="position: relative;">
            <label>CNPJ/CPF</label>
            <input type="text" id="cnpj_cpf" />
            <button id="btnBuscarCNPJ" type="button" style="position: absolute; right: 5px; top: 28px;">🔍</button>
          </div>
        </div>

        <div class="form-linha">
          <div class="form-grupo">
            <label>Inscrição Estadual</label>
            <input type="text" id="inscricao_estadual" />
          </div>
          <div class="form-grupo">
            <label>Inscrição Municipal</label>
            <input type="text" id="inscricao_municipal" />
          </div>
        </div>

        <div class="form-linha">
          <div class="form-grupo">
            <label>Segmento</label>
            <select id="segmento"></select>
          </div>
          <div class="form-grupo">
            <label>Classificação</label>
            <select id="classificacao"></select>
          </div>
        </div>

        <div class="form-linha">
          <div class="form-grupo" style="flex: 1 1 100%;">
            <label>Vendedor</label>
            <select id="vendedor"></select>
          </div>
        </div>
      </fieldset>

      <!-- 🧱 Bloco 2: Contato -->
      <fieldset class="form-bloco">
        <legend>📞 Contato</legend>
        <div class="form-linha">
          <div class="form-grupo">
            <label>Email</label>
            <input type="email" id="email" />
          </div>
          <div class="form-grupo">
            <label>Telefone</label>
            <input type="text" id="telefone" />
          </div>
        </div>

        <div class="form-linha">
          <div class="form-grupo">
            <label>Celular</label>
            <input type="text" id="celular" />
          </div>
          <div class="form-grupo">
            <label>Pessoa de Contato</label>
            <input type="text" id="pessoa_contato" />
          </div>
        </div>
      </fieldset>

      <!-- 🧱 Bloco 3: Endereço -->
      <fieldset class="form-bloco">
        <legend>📍 Endereço</legend>
        <div class="form-linha">
          <div class="form-grupo">
            <label>CEP</label>
            <input type="text" id="cep" />
          </div>
          <div class="form-grupo">
            <label>Tipo Logradouro</label>
            <input type="text" id="tipo_logradouro" />
          </div>
        </div>

        <div class="form-linha">
          <div class="form-grupo">
            <label>Nome Logradouro</label>
            <input type="text" id="nome_logradouro" />
          </div>
          <div class="form-grupo">
            <label>Número</label>
            <input type="text" id="numero" />
          </div>
        </div>

        <div class="form-linha">
          <div class="form-grupo">
            <label>Complemento</label>
            <input type="text" id="complemento" />
          </div>
          <div class="form-grupo">
            <label>Bairro</label>
            <input type="text" id="bairro" />
          </div>
        </div>

        <div class="form-linha">
          <div class="form-grupo">
            <label>Cidade</label>
            <input type="text" id="cidade" />
          </div>
          <div class="form-grupo">
            <label>Estado</label>
            <input type="text" id="estado" />
          </div>
        </div>
      </fieldset>

      <!-- 🧱 Bloco 4: Outros (centralizado abaixo do meio) -->
      <fieldset class="form-bloco outros">
        <legend>⚙️ Outros</legend>
        <div class="form-linha">
          <label><input type="checkbox" id="ativo" /> Ativo</label>
        </div>
      </fieldset>

    </div>

    <!-- Botões -->
    <div class="form-botoes">
      <button type="submit">💾 Salvar Cliente</button>
      <button type="reset" class="btn-limpar">🧹 Limpar</button>
    </div>
  </form>
</div>

<!-- Aqui você importa o JS com os eventos e integração -->
<script src="../customerRegistration/customerRegistration.js"></script>
